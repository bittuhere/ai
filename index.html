<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>BitBot v17 — Arcade Hub AI · Class 1–8 Maths Master</title>
<style>
    /* BitBot v17 — solid, minimal, Gemini/DuckDuckGo-like light theme. No gradients, no emoji chrome, inline SVG icons. */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
        --bg: #ffffff; --bg2: #f5f6f7; --line: #e3e6e8; --txt: #1f2328; --txt2: #5f6368;
        --acc: #1a73e8; --acc-d: #1765cc; --ok: #188038; --warn: #f9ab00; --bad: #d93025;
        --bot-bg: #f1f3f4; --radius: 16px;
    }
    html, body { height: 100%; }
    body {
        background: var(--bg); color: var(--txt);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px; line-height: 1.55; display: flex; flex-direction: column; overflow: hidden;
    }
    svg { display: block; }

    /* ── header ── */
    header {
        position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--acc); color: #fff;
            display: flex; align-items: center; justify-content: center; flex: none; }
    .logo svg { width: 22px; height: 22px; }
    .hwrap { min-width: 0; }
    header h1 { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .sub { font-size: 11.5px; color: var(--txt2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
    #status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--txt2);
              background: var(--bg2); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
    #status.busy .dot { background: var(--warn); }
    .ibtn { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--txt2); flex: none; }
    .ibtn:hover { background: var(--bg2); color: var(--txt); }
    .ibtn svg { width: 18px; height: 18px; }

    /* ── chat ── */
    #chat { flex: 1; overflow-y: auto; padding: 22px 16px 10px; display: flex; flex-direction: column; gap: 14px;
            width: 100%; max-width: 860px; margin: 0 auto; scroll-behavior: smooth; }
    .msg { display: flex; flex-direction: column; max-width: 84%; animation: pop .16s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .msg.me { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .mbody { padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; }
    .msg.me .mbody { background: var(--acc); color: #fff; border-bottom-right-radius: 6px; }
    .msg.bot .mbody { background: var(--bot-bg); color: var(--txt); border-bottom-left-radius: 6px; }
    .mbody h3, .mbody h4, .mbody h5 { white-space: normal; margin: 8px 0 4px; font-size: 15px; }
    .mbody ul, .mbody ol { white-space: normal; margin: 6px 0 6px 20px; }
    .mbody table { white-space: normal; border-collapse: collapse; margin: 8px 0; font-size: 13.5px; }
    .mbody th, .mbody td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
    .mbody th { background: var(--bg2); }
    .mbody pre { white-space: pre; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
                 padding: 8px 10px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
    .mbody code { background: #e8eaed; border-radius: 5px; padding: 1px 5px; font-size: 13px;
                  font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; }
    .mbody pre code { background: none; padding: 0; }
    .mbody a { color: var(--acc); }
    .msg.me .mbody a { color: #fff; text-decoration: underline; }
    .time { font-size: 10.5px; color: var(--txt2); margin: 4px 6px; }
    .copybtn { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--line);
               color: var(--txt2); border-radius: 8px; padding: 4px 9px; font-size: 11.5px; cursor: pointer; margin-top: 4px; }
    .copybtn:hover { background: var(--bg2); color: var(--txt); }
    .copybtn svg { width: 13px; height: 13px; }

    /* typing dots */
    .typing { display: none; align-items: center; gap: 5px; }
    .typing.show { display: flex; align-self: flex-start; width: max-content; margin: 0 auto 0 max(16px, calc(50% - 414px));
                   padding: 12px 14px; background: var(--bot-bg); border-radius: var(--radius); border-bottom-left-radius: 6px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: #9aa0a6; animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; }
    .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 16px 10px;
             max-width: 860px; margin: 0 auto; width: 100%; }
    .chips:empty { display: none; }
    .chip { background: var(--bg); border: 1px solid var(--line); color: var(--txt); border-radius: 999px;
            padding: 7px 14px; font-size: 13px; cursor: pointer; }
    .chip:hover { background: var(--bg2); border-color: #cfd4d8; }

    /* ── composer ── */
    footer { position: sticky; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--line);
             padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
    footer .fwrap { display: flex; gap: 10px; align-items: center; max-width: 860px; margin: 0 auto; }
    #inp { flex: 1; background: var(--bg); border: 1.5px solid #dadce0; border-radius: 24px; padding: 12px 18px;
           font-size: 15px; color: var(--txt); outline: none; font-family: inherit; }
    #inp:focus { border-color: var(--acc); }
    #send { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--acc); color: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
    #send:hover { background: var(--acc-d); }
    #send:disabled { background: #c6d7f4; cursor: default; }
    #send svg { width: 20px; height: 20px; }

    /* ── chain-of-thought (BitBot engine traces) ── */
    .cot { align-self: flex-start; max-width: 84%; background: var(--bg); border: 1px solid var(--line);
           border-radius: 10px; font-size: 12px; color: var(--txt2); overflow: hidden; }
    .cot .thead { padding: 7px 12px; cursor: pointer; user-select: none; font-weight: 600; color: var(--txt2); }
    .cot .tbody { display: none; padding: 4px 12px 10px; border-top: 1px solid var(--line); }
    .cot.open .tbody { display: block; }
    .cot .tstep { padding: 3px 0; border-bottom: 1px dashed var(--line); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
    .cot .tstep:last-child { border-bottom: none; }

    /* ── BitLM Pro streaming UI ── */
    .prothink { margin-bottom: 8px; width: 100%; }
    .prothink summary { cursor: pointer; color: var(--txt2); font-size: 12px; font-weight: 600; user-select: none; list-style: none; }
    .prothink summary::-webkit-details-marker { display: none; }
    .prothink summary::before { content: '\25B8'; display: inline-block; margin-right: 6px; transition: transform .15s; }
    .prothink[open] summary::before { transform: rotate(90deg); }
    .thinkbody { white-space: pre-wrap; font-size: 12px; color: var(--txt2); max-height: 170px; overflow-y: auto;
                 margin: 6px 0; padding: 8px 10px; border-left: 2px solid var(--line); background: var(--bg2); border-radius: 6px; }
    .prostatus { color: var(--acc); font-size: 12px; margin: 4px 0; }
    .calclog { white-space: pre-wrap; font-size: 11px; color: var(--ok); margin-top: 6px; }

    /* ── loader / download overlays ── */
    #loader, #dlOv { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column;
                     align-items: center; justify-content: center; gap: 14px; padding: 24px;
                     transition: opacity .45s ease; text-align: center; }
    #loader.hide, #dlOv.hide { opacity: 0; pointer-events: none; }
    #dlOv { display: none; }
    #dlOv.show { display: flex; }
    .lmark { width: 64px; height: 64px; border-radius: 18px; background: var(--acc); color: #fff;
             display: flex; align-items: center; justify-content: center; animation: breathe 1.6s ease-in-out infinite; }
    .lmark svg { width: 38px; height: 38px; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .lpct { font-size: 40px; font-weight: 800; letter-spacing: -.5px; color: var(--txt); }
    .lbar { width: min(78vw, 380px); height: 8px; background: var(--bg2); border: 1px solid var(--line);
            border-radius: 999px; overflow: hidden; }
    .lfill { height: 100%; width: 0%; background: var(--acc); border-radius: 999px; transition: width .18s ease; }
    .lstep { font-size: 13px; color: var(--txt2); transition: opacity .16s; max-width: 80vw; }
    #dlTitle { font-size: 17px; font-weight: 700; }
    #dlmb { font-size: 13px; color: var(--txt); font-weight: 600; }
    #dlCancel { margin-top: 8px; }

    /* ── model choice modal ── */
    #modelOv { position: fixed; inset: 0; z-index: 110; background: rgba(32, 33, 36, .55); display: none;
               align-items: center; justify-content: center; padding: 20px; }
    #modelOv.show { display: flex; }
    .mo-box { background: var(--bg); border-radius: 20px; max-width: 640px; width: 100%; padding: 28px 26px 24px;
              text-align: center; max-height: 92vh; overflow-y: auto; }
    .mo-logo { width: 56px; height: 56px; border-radius: 16px; background: var(--acc); color: #fff; margin: 0 auto 14px;
               display: flex; align-items: center; justify-content: center; }
    .mo-logo svg { width: 32px; height: 32px; }
    .mo-box h2 { font-size: 21px; font-weight: 800; letter-spacing: -.2px; }
    .mo-sub { color: var(--txt2); font-size: 13.5px; margin: 6px 0 18px; }
    .mo-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mo-card { background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 16px 14px;
               text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font-family: inherit; }
    .mo-card:hover { border-color: #b8c8e8; background: #fbfcfe; }
    .mo-card.sel { border-color: var(--acc); background: #f2f7fe; }
    .mo-name { font-size: 16px; font-weight: 800; color: var(--txt); }
    .mo-desc { font-size: 12.5px; color: var(--txt2); line-height: 1.45; }
    .mo-size { font-size: 12px; font-weight: 700; color: var(--acc); margin-top: auto; padding-top: 6px; }
    .mo-note { margin: 16px 0 4px; font-size: 12.5px; color: var(--txt2); background: var(--bg2);
               border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
    .mo-cta { margin-top: 14px; background: var(--acc); color: #fff; border: none; border-radius: 999px;
              padding: 12px 34px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .mo-cta:hover { background: var(--acc-d); }
    .mo-cta:disabled { background: #c6d7f4; cursor: default; }
    .mo-cta.ghost { background: var(--bg); color: var(--txt2); border: 1px solid var(--line); font-weight: 600; font-size: 13px; padding: 9px 20px; }
    .mo-cta.ghost:hover { background: var(--bg2); }
    .mo-req { margin-top: 12px; font-size: 12.5px; color: var(--bad); min-height: 16px; }

    /* ── history panel ── */
    #histOv { position: fixed; inset: 0; z-index: 90; background: rgba(32, 33, 36, .45); display: none; }
    #histOv.show { display: block; }
    #histPanel { position: absolute; top: 0; right: 0; bottom: 0; width: min(92vw, 380px); background: var(--bg);
                 border-left: 1px solid var(--line); display: flex; flex-direction: column; }
    .hp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px;
               border-bottom: 1px solid var(--line); font-size: 15px; }
    .hp-head button { background: none; border: none; color: var(--txt2); cursor: pointer; width: 32px; height: 32px;
                      display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    .hp-head button:hover { background: var(--bg2); }
    .hp-head svg { width: 16px; height: 16px; }
    #histList { overflow-y: auto; padding: 8px; flex: 1; }
    .hp-row { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; }
    .hp-row:hover { background: var(--bg2); }
    .hp-info { flex: 1; min-width: 0; }
    .hp-info b { display: block; font-size: 13.5px; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hp-info span { display: block; font-size: 11px; color: var(--txt2); margin-top: 2px; }
    .hp-open, .hp-del { background: var(--bg); border: 1px solid var(--line); color: var(--txt2); border-radius: 8px;
                        padding: 5px 10px; font-size: 12px; cursor: pointer; }
    .hp-open:hover { background: var(--bg2); color: var(--txt); }
    .hp-del:hover { border-color: var(--bad); color: var(--bad); }
    .hp-empty { padding: 26px 14px; text-align: center; color: var(--txt2); font-size: 13px; }

    /* ── error banner ── */
    #errBanner { position: fixed; top: 0; left: 0; right: 0; z-index: 120; display: none; align-items: center; gap: 10px;
                 background: #fce8e6; color: #a50e0e; border-bottom: 1px solid #f5c6c0; padding: 10px 16px; font-size: 13px; }
    #errBanner.show { display: flex; }
    #errText { flex: 1; }
    #errClose { background: none; border: none; color: #a50e0e; cursor: pointer; width: 28px; height: 28px;
                display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    #errClose:hover { background: rgba(165, 14, 14, .08); }
    #errClose svg { width: 14px; height: 14px; }

    #ver { position: fixed; left: 10px; bottom: 6px; font-size: 10.5px; color: #9aa0a6; z-index: 5; pointer-events: none; }

    @media (max-width: 640px) {
        .sub { display: none; }
        .msg { max-width: 94%; }
        .mo-cards { grid-template-columns: 1fr; }
        #chat { padding: 14px 10px 8px; }
        .typing.show { margin-left: 10px; }
    }
</style>
</head>
<body>
<div id="loader">
    <div class="lmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7.5" width="16" height="11.5" rx="3"></rect><path d="M12 4.2V7.5"></path><circle cx="12" cy="3.4" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="9.2" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="14.8" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><path d="M9.8 16.3h4.4"></path></svg></div>
    <div class="lpct" id="lpct">0%</div>
    <div class="lbar"><div class="lfill" id="lfill"></div></div>
    <div class="lstep" id="lstep">starting…</div>
</div>

<div id="modelOv">
    <div class="mo-box">
        <div class="mo-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7.5" width="16" height="11.5" rx="3"></rect><path d="M12 4.2V7.5"></path><circle cx="12" cy="3.4" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="9.2" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="14.8" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><path d="M9.8 16.3h4.4"></path></svg></div>
        <h2>Which AI do you want to use?</h2>
        <p class="mo-sub">You can switch anytime later from the header.</p>
        <div class="mo-cards">
            <button class="mo-card" id="cardBitlm" type="button">
                <span class="mo-name">BitLM</span>
                <span class="mo-desc">A large language model — writing, ideas, stories, homework and daily works. Runs on your own device.</span>
                <span class="mo-size" id="bitlmSize">494M params · ~400 MB one-time download</span>
            </button>
            <button class="mo-card" id="cardBitbot" type="button">
                <span class="mo-name">BitBot</span>
                <span class="mo-desc">A model completely made from scratch — Arcade Hub personal assistant + Class 1–8 Maths Master with exact engines.</span>
                <span class="mo-size" id="bitbotSize">1.27 cr params · ~17 MB · included — instant &amp; offline</span>
            </button>
        </div>
        <p class="mo-note">Once you would download, you would not need to download next time.</p>
        <button id="moGo" class="mo-cta" type="button" disabled>Continue</button>
        <p class="mo-req" id="moReq"></p>
    </div>
</div>

<div id="dlOv">
    <div class="lmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7.5" width="16" height="11.5" rx="3"></rect><path d="M12 4.2V7.5"></path><circle cx="12" cy="3.4" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="9.2" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="14.8" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><path d="M9.8 16.3h4.4"></path></svg></div>
    <h3 id="dlTitle">Downloading BitLM…</h3>
    <div class="lpct" id="dlpct">0%</div>
    <div class="lbar"><div class="lfill" id="dlfill"></div></div>
    <div id="dlmb">0 MB of 400 MB</div>
    <div class="lstep" id="dlstep">preparing…</div>
    <button id="dlCancel" class="mo-cta ghost" type="button">Cancel — use BitBot instead</button>
</div>

<header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7.5" width="16" height="11.5" rx="3"></rect><path d="M12 4.2V7.5"></path><circle cx="12" cy="3.4" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="9.2" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="14.8" cy="12.8" r="1.1" fill="currentColor" stroke="none"></circle><path d="M9.8 16.3h4.4"></path></svg></div>
    <div class="hwrap">
        <h1>BitBot</h1>
        <div class="sub">Arcade Hub assistant · Class 1–8 Maths Master · <span id="brainspec">…</span></div>
    </div>
    <div id="status"><span class="dot"></span><span id="statusTxt">booting…</span></div>
    <button id="modelBtn" class="ibtn" title="Switch model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13"></path><path d="M14 5l3 3-3 3"></path><path d="M20 16H7"></path><path d="M10 13l-3 3 3 3"></path></svg></button>
    <button id="histBtn" class="ibtn" title="Saved chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></button>
    <button id="clearBtn" class="ibtn" title="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
</header>

<div id="chat"></div>
<div class="typing" id="typing"><i></i><i></i><i></i></div>
<div class="chips" id="chips"></div>

<div id="histOv">
    <div id="histPanel">
        <div class="hp-head"><b>Saved chats <span id="histCount" style="color:var(--txt2);font-weight:400"></span></b><button id="histClose" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></div>
        <div id="histList"></div>
    </div>
</div>

<footer>
    <div class="fwrap">
        <input id="inp" type="text" placeholder="Ask anything — maths, science, writing, Arcade Hub…" autocomplete="off">
        <button id="send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5.5 11.5L12 5l6.5 6.5"></path></svg></button>
    </div>
</footer>

<div id="errBanner"><span id="errText"></span><button id="errClose" title="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></div>
<div id="ver">BitBot v17</div>

<script>
/* BitBot loader (v6) — REAL progress: every % step is an actual file load. */
(function () {
    var pct = 0, target = 0, el = null, fill = null, step = null;
    function setP(p, label) {
        target = p;
        if (label && step) {
            step.style.opacity = 0;
            setTimeout(function () { step.textContent = label; step.style.opacity = 1; }, 160);
        }
    }
    window.__setLoad = setP;
    window.__loaderDone = function () {
        setP(100, 'ready');
        setTimeout(function () {
            var l = document.getElementById('loader');
            if (l) { l.classList.add('hide'); setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 700); }
        }, 400);
    };
    function tick() {

                ' → char-trigram hash features let me still recognise its SHAPE (typo-tolerant!)');
        cot('🧠 neural net top-3 → ① ' + r.tag + ' (' + (r.prob * 100).toFixed(1) + '%)' +
            (r.tag2 ? ' · ② ' + r.tag2 + ' (' + (r.prob2 * 100).toFixed(1) + '%)' : '') +
            (r.tag3 ? ' · ③ ' + r.tag3 + ' (' + (r.prob3 * 100).toFixed(1) + '%)' : ''));

        if (r.prob < THRESHOLD || (coverage < 0.35 && r.prob < 0.75)) {
            // low confidence → HONEST fallback, never a confident guess (+ memory hint)
            cot('🚦 below ' + Math.round(THRESHOLD * 100) + '% confidence → admitting I do not know');
            setTimeout(function () { showChips(["Tell me a fact", "Tell me a joke", "What games are there?", "How do I add friends?"]); }, 300);
            var fb = dynamicAttempt(text) || fallbackMsg();
            var pm = text.match(/who (?:is|was|are)\s+([a-z][a-z .]{1,25})/i);
            if (pm) fb = "I don't know **" + pm[1].trim() + "** — a friend of yours? 😄 I know Arcade Hub, school subjects (science, math, history, GK) and general knowledge!";
            if (memActive()) fb += "\n\nPS: we were just talking about " + topicLabel(MEM.lastTag) + ' — say "more" if you want more of that!';
            return fb;
        }
        // v7 HONESTY GUARD: salient unknown words + not-high confidence → admit ignorance
        var salientUnknown = [];
        toks.forEach(function (w) { if (w.length >= 4 && vocabInfo.index[w] === undefined && !/^\d+$/.test(w)) salientUnknown.push(w); });
        if (salientUnknown.length && r.prob < 0.75) {
            cot('🚨 unknown word' + (salientUnknown.length > 1 ? 's' : '') + ': ' + salientUnknown.join(', ') + ' — only ' + (r.prob * 100).toFixed(0) + '% sure → admitting ignorance');
            setTimeout(function () { showChips(["Tell me a fact", "Tell me a joke", "What games are there?", "How do I add friends?"]); }, 300);
            var fb2 = dynamicAttempt(text) || fallbackMsg();
            var pm2 = text.match(/who (?:is|was|are)\s+([a-z][a-z .]{1,25})/i);
            if (pm2) fb2 = "I don't know **" + pm2[1].trim() + "** — a friend of yours? 😄 I know Arcade Hub, school subjects (science, math, history, GK) and general knowledge!";
            else if (fb2.indexOf('🎨') !== 0) fb2 = "I don't fully understand that — some words are new to me! 🤷 Try simpler wording, or ask about games, math, science, GK, history or the site.";
            if (memActive()) fb2 += "\n\nPS: we were just talking about " + topicLabel(MEM.lastTag) + ' — say "more" if you want more of that!';
            return fb2;
        }
        var hedge = r.prob < 0.68 ? "🤔 Not fully sure, but here's my best answer:\n\n" : "";
        if (hedge) cot('⚖ only ' + (r.prob * 100).toFixed(0) + '% sure → answering with an honest hedge');
        return hedge + answerFor(text, r, game || (pronounRef ? lastGame : null));
    }

    // given a confident classification, produce the answer (shared with multi-question mode)
    function answerFor(text, r, game) {
        // ── SKILLS: computed live, not memorized ─────────────────────
        if (r.tag === "bot_speed") {
            rememberTurn("bot_speed");
            var t0 = performance.now(), N = 1000;
            for (var si = 0; si < N; si++) predict("how do i enable notifications on my phone");
            var ms = performance.now() - t0;
            cot('⚡ live benchmark: ' + N + ' classifications in ' + ms.toFixed(1) + ' ms');
            return "⚡ **Speed test — live result:**\nI just classified **" + N + " messages in " + ms.toFixed(1) + " ms** — that is **" + (ms / N * 1000).toFixed(0) + " microseconds per answer**!\n\nPure math, zero lag. Try to out-ask me! 😄";
        }
        if (r.tag === "skill_quizme") { cot('🎯 quiz skill → picking an unseen question'); rememberTurn("skill_quizme"); return doQuiz(); }
        if (r.tag === "skill_convert") {
            var cv = doConvert(text);
            if (cv) { rememberTurn("skill_convert"); return cv; }
            if (!/\d/.test(text)) return dynamicAttempt(text) || fallbackMsg();     // no numbers → was a misclassification
            return 'Give me units to convert! 📐 Try "5 km to miles", "10 kg in pounds" or "100 c to f".';
        }
        if (r.tag === "skill_random") { cot('🎲 dice/coin/random skill'); rememberTurn("skill_random"); return doRandom(text); }
        if (r.tag === "skill_calc") {
            var cv2 = doConvert(text);
            if (cv2) { rememberTurn("skill_convert"); return cv2; }
            cot('🧮 full-math solver engaged');
            rememberTurn("skill_calc"); return doMath(text);
        }
        if (r.tag === "skill_time") { cot('🕐 live clock skill'); rememberTurn("skill_time"); return timeAnswer(); }
        if (r.tag === "skill_joke") { rememberTurn("skill_joke"); return pickFresh(JOKES, "skill_joke"); }
        if (r.tag === "study_fact") { rememberTurn("study_fact"); return pickFresh(FACTS, "study_fact"); }
        // entity-driven intents
        if (r.tag === "game_info" || r.tag === "how_to_play") {
            var g2 = game || lastGame;
            if (g2) {
                rememberTurn(r.tag);
                var g = BitData.GAMES[g2];
                return r.tag === "game_info" ? g.info : g.play;
            }
            return "Which game? 🎮 Try: car, snake, flappy, dino, pacman, tic tac toe, arcadecraft or the quiz!";
        }
        // find the intent's responses (anti-repeat cycling)
        var rs = intentResponses(r.tag);
        if (rs && rs.length) { rememberTurn(r.tag); return pickFresh(rs, r.tag); }
        return dynamicAttempt(text) || fallbackMsg();
    }

    // v7: multi-question v2 — answer every understood part, ADMIT the rest
    function multiAnswer(text) {
        // strip leading greeting so it can't dilute per-part prediction
        text = String(text).replace(/^(?:hey|hi|hello|yo|hiya|namaste|namaskar|ok|okay)\s+(?:bitbot|bit|bot)\s*[,!.]?\s*/i, '')
                           .replace(/^(?:hey|hi|hello|yo|namaste|namaskar)\s*[,!.]?\s+/i, '');
        var parts = text.split(/[?!.]\s+/).map(function (s) { return s.trim(); })
                        .filter(function (s) { return s.length > 2; });
        if (parts.length < 2) return null;
        // whole text solvable by BitX (word problem spanning the split point) → don't split.
        // only when ≤1 '?' — true multi-question texts (2+ '?') should still split & answer all parts
        if ((text.match(/\?/g) || []).length <= 1) {
            try { if (window.BitX && BitX.solve(text)) return null; } catch (e) {}
        }
        var answers = [], unknown = 0, seenTags = {};
        for (var i = 0; i < parts.length && i < 3; i++) {
            var seg = parts[i];
            // v14: each part gets the full BitX maths solver FIRST — a word problem
            // split by its own sentence dots must not fall back to brain KB.
            var bxPart = null;
            try { bxPart = window.BitX ? BitX.solve(seg) : null; } catch (eBx) { bxPart = null; }
            if (bxPart && bxPart.ok) { answers.push({ tag: 'bitx-' + i, ans: fmtBitX(bxPart) }); continue; }
            var toks = BitBrain.tokenize(seg).map(BitBrain.stem);
            var known = 0;
            toks.forEach(function (w) { if (vocabInfo.index[w] !== undefined) known++; });
            var coverage = toks.length ? known / toks.length : 0;
            var pr = predict(seg);
            if (coverage < 0.35 || pr.prob < 0.45) { unknown++; continue; }
            if (seenTags[pr.tag]) continue;
            seenTags[pr.tag] = 1;
            var gm = findGame(seg);
            if (gm) { lastGame = gm; MEM.gameTime = Date.now(); }
            answers.push({ tag: pr.tag, ans: answerFor(seg, pr, gm || lastGame) });
        }
        if (!answers.length) return null;             // nothing understood → normal path / honest fallback
        cot('✂ detected ' + parts.length + ' questions → understood ' + answers.length + (unknown ? ', admitted ' + unknown + ' unknown' : ''));
        if (answers.length === 1) {
            rememberTurn(answers[0].tag);
            return (unknown ? "I caught **one** of those questions 😄 — here goes:\n\n" : "") +
                answers[0].ans +
                (unknown ? "\n\n*(the other part went over my head — try asking it alone? 🤔)*" : "");
        }
        var out = "You asked **" + answers.length + " things**! 😄\n\n";
        answers.forEach(function (a, idx) {
            out += "**" + (idx + 1) + ")** " + a.ans + "\n\n";
        });
        rememberTurn(answers[answers.length - 1].tag);
        return out + "Ask one at a time for the full markdown answer! 📝";
    }

    // ── MARKDOWN RENDERER (v5) ─────────────────────────────────────────────
    // BitBot answers in markdown (like real AIs); this renders it in the
    // chat: **bold**, *italic*, code, code blocks, # headings, lists, links.
    /* ── GREAT PARSER (v14) — math in bot output always encodes correctly:
          2^2 → 2², x^(-1) → x⁻¹, 1/3 → ⅓, 1/52 → stacked fraction, 2*3 → 2×3.
          Code spans and links are stashed first so their innards are never touched. ── */
    var SUP_MAP = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹',
                    '-':'⁻','+':'⁺','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ' };
    var FRAC_MAP = { '1/2':'½','1/3':'⅓','2/3':'⅔','1/4':'¼','3/4':'¾','1/5':'⅕','2/5':'⅖','3/5':'⅗','4/5':'⅘',
                     '1/6':'⅙','5/6':'⅚','1/7':'⅐','1/8':'⅛','3/8':'⅜','5/8':'⅝','7/8':'⅞','1/9':'⅑','1/10':'⅒','1/12':'⅟₁₂' };
    function mathEncode(t) {
        return String(t)
            .replace(/\^\(([^)]{1,8})\)|\^([0-9ni+-]{1,3})/g, function (mm, g1, g2) {
                var e = g1 || g2, ok = true, sup = '';
                for (var k = 0; k < e.length; k++) {
                    if (SUP_MAP[e[k]] === undefined) { ok = false; break; }
                    sup += SUP_MAP[e[k]];
                }
                return ok ? sup : '<sup>' + e + '</sup>';
            })
            .replace(/(^|[^\d.a-zA-Z\/])(\d{1,2}\/\d{1,2})(?![\d\/a-zA-Z.])/g, function (mm, pre, f) {
                if (FRAC_MAP[f]) return pre + FRAC_MAP[f];
                var pp = f.split('/');
                if (+pp[0] < 1000 && +pp[1] < 1000)
                    return pre + '<span class="frac"><span class="fn">' + pp[0] + '</span><span class="fd">' + pp[1] + '</span></span>';
                return mm;
            })
            .replace(/(\d|[a-z)\u2212])\*(\d|\()/g, '$1×$2');
    }
    function mdInline(t) {
        var stash = [];
        function keep(html) { stash.push(html); return '\u0001' + (stash.length - 1) + '\u0001'; }
        t = String(t)
            .replace(/\u0060([^\u0060]+)\u0060/g, function (mm, c) { return keep('<code>' + c + '</code>'); })
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function (mm, tx, url) {
                return keep('<a href="' + url + '" target="_blank" rel="noopener">' + tx + '</a>');
            });
        t = mathEncode(t)
            .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
            .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<i>$2</i>');
        return t.replace(/\u0001(\d+)\u0001/g, function (mm, i) { return stash[+i]; });
    }
    function mdRender(src) {
        var esc = String(src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var lines = esc.split('\n');
        var out = [], inUl = false, inOl = false, inCode = false, buf = [];
        function closeList() { if (inUl) { out.push('</ul>'); inUl = false; } if (inOl) { out.push('</ol>'); inOl = false; } }
        for (var i = 0; i < lines.length; i++) {
            var ln = lines[i];
            if (/^[\u0060]{3}/.test(ln)) {
                if (inCode) { out.push('<pre><code>' + buf.join('\n') + '</code></pre>'); buf = []; inCode = false; }
                else { closeList(); inCode = true; }
                continue;
            }
            if (inCode) { buf.push(ln); continue; }
            var h = ln.match(/^(#{1,3})\s+(.*)$/);
            if (h) { closeList(); out.push('<h' + (h[1].length + 2) + '>' + mdInline(h[2]) + '</h' + (h[1].length + 2) + '>'); continue; }
            // v10: markdown tables (| a | b |) — header row + |---| separator
            if (/^\s*\|/.test(ln)) {
                var tbuf = [];
                while (i < lines.length && /^\s*\|/.test(lines[i])) { tbuf.push(lines[i].trim()); i++; }
                i--;
                closeList();
                var html = '<table>', headerDone = false;
                tbuf.forEach(function (row) {
                    if (/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(row) && row.indexOf('-') !== -1) { headerDone = true; return; }
                    var cells = row.replace(/^\|/, '').replace(/\|$/, '').split('|');
                    var tag = headerDone ? 'td' : 'th';
                    html += '<tr>' + cells.map(function (c) { return '<' + tag + '>' + mdInline(c.trim()) + '</' + tag + '>'; }).join('') + '</tr>';
                    if (!headerDone) headerDone = 'pending';
                });
                html += '</table>';
                out.push(html);
                continue;
            }
            var ul = ln.match(/^[-•]\s+(.*)$/);
            var ol = ln.match(/^\d+[.)]\s+(.*)$/);
            if (ul || ol) {
                if (ul && inOl) { out.push('</ol>'); inOl = false; }
                if (ol && inUl) { out.push('</ul>'); inUl = false; }
                if (ul && !inUl) { out.push('<ul>'); inUl = true; }
                if (ol && !inOl) { out.push('<ol>'); inOl = true; }
                out.push('<li>' + mdInline(ul ? ul[1] : ol[1]) + '</li>');
                continue;
            }
            closeList();
            if (ln.trim() === '') out.push('<div class="sp"></div>');
            else out.push('<div>' + mdInline(ln) + '</div>');
        }
        closeList();
        if (inCode) out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
        return out.join('');
    }

    // ── CHAIN OF THOUGHT (v7) — real reasoning steps, shown before each answer ──
    var COT = [];
    function cot(line) { COT.push(line); }
    function showThinking(trace, done) {
        if (!trace || !trace.length) { done(); return; }
        var d = document.createElement('div');
        d.className = 'cot open';
        var head = document.createElement('div');
        head.className = 'thead';
        head.textContent = 'Thinking…';
        var body = document.createElement('div');
        body.className = 'tbody';
        d.appendChild(head); d.appendChild(body);
        chat.appendChild(d); scroll();
        var i = 0;
        (function next() {
            if (i < trace.length) {
                var ln = document.createElement('div');
                ln.className = 'tstep';
                ln.textContent = trace[i++];
                body.appendChild(ln); scroll();
                head.textContent = 'Thinking (' + i + '/' + trace.length + ')…';
                setTimeout(next, 240);
            } else {
                d.classList.remove('open');
                head.textContent = trace.length + ' thought steps — tap to view';
                head.onclick = function () { d.classList.toggle('open'); scroll(); };
                setTimeout(done, 200);
            }
        })();
    }

    // ── UI ─────────────────────────────────────────────────────────────────
    /* ── CHAT SAVING (v14) — every conversation auto-saved to IndexedDB
          with an auto-generated heading; 💾 button opens the history panel ── */
    var ChatStore = (function () {
        var DB = 'bitbot-chats', STORE = 'chats', db = null, mem = null;
        function lsGet() { if (mem) return mem; try { mem = JSON.parse(localStorage.getItem('bb_chats') || '{}'); } catch (e) { mem = {}; } return mem; }
        function lsPut() { try { localStorage.setItem('bb_chats', JSON.stringify(mem)); } catch (e) {} }
        function open(cb) {
            try {
                if (typeof indexedDB === 'undefined') throw 0;
                var rq = indexedDB.open(DB, 1);
                rq.onupgradeneeded = function (e) {
                    var d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
                };
                rq.onsuccess = function (e) { db = e.target.result; if (cb) cb(); };
                rq.onerror = function () { db = null; if (cb) cb(); };
            } catch (e) { db = null; if (cb) cb(); }
        }
        function put(chat, cb) {
            if (!chat || !chat.msgs || !chat.msgs.length) { if (cb) cb(); return; }
            if (!db) { lsGet(); mem[chat.id] = chat; lsPut(); if (cb) cb(); return; }
            try {
                var tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).put(chat);
                tx.oncomplete = function () { if (cb) cb(); };
                tx.onerror = function () { if (cb) cb(); };
            } catch (e) { if (cb) cb(); }
        }
        function all(cb) {
            if (!db) { lsGet(); cb(Object.keys(mem).map(function (k) { return mem[k]; })); return; }
            try {
                var rq = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
                rq.onsuccess = function () { cb(rq.result || []); };
                rq.onerror = function () { cb([]); };
            } catch (e) { cb([]); }
        }
        function del(id, cb) {
            if (!db) { lsGet(); delete mem[id]; lsPut(); if (cb) cb(); return; }
            try {
                var tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).delete(id);
                tx.oncomplete = function () { if (cb) cb(); };
                tx.onerror = function () { if (cb) cb(); };
            } catch (e) { if (cb) cb(); }
        }
        return { open: open, put: put, all: all, del: del };
    })();
    var curChat = null, chatSaveT = null;
    function newChat() {
        PRO_HIST = []; PRO_CTX_NOTED = false;                                  // v17: fresh BitLM context
        curChat = { id: 'c' + Date.now() + '-' + Math.floor(Math.random() * 1e4), title: '', created: Date.now(), updated: Date.now(), msgs: [] };
    }
    function autoTitle(t) {
        t = String(t || '').replace(/\s+/g, ' ').trim()
            .replace(/^(?:(?:pls|please|plz|hey|hi|hello|bitbot|yaar|bhai|solve this|solve|batao|can you tell me|with full steps|tell me|this|it|the question|question)[,:]?\s*)+/i, '')
            .replace(/[?!]+$/, '');
        if (!t) return 'New chat';
        if (t.length > 44) t = t.slice(0, 44).replace(/\s+\S*$/, '') + '…';
        return t.charAt(0).toUpperCase() + t.slice(1);
    }
    function chatAdd(role, text) {
        if (!text) return;
        if (!curChat) newChat();
        curChat.msgs.push({ role: role, text: String(text), t: Date.now() });
        curChat.updated = Date.now();
        if (!curChat.title && role === 'me' && !/^(hi|hey|hello|namaste|good (morning|afternoon|evening))\b/i.test(text.trim()))
            curChat.title = autoTitle(text);
        if (!curChat.title && curChat.msgs.length >= 2) curChat.title = autoTitle(curChat.msgs[0].text);
        clearTimeout(chatSaveT);
        chatSaveT = setTimeout(function () { ChatStore.put(curChat); }, 400);
    }
    function renderHist() {
        ChatStore.all(function (chats) {
            chats = chats.filter(function (c) { return c && c.msgs && c.msgs.length; });
            chats.sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
            var el = document.getElementById('histList');
            var cnt = document.getElementById('histCount');
            if (cnt) cnt.textContent = chats.length ? '(' + chats.length + ')' : '';
            el.innerHTML = '';
            if (!chats.length) {
                el.innerHTML = '<div class="hp-empty">No saved chats yet — ask me something and this chat appears here automatically.</div>';
                return;
            }
            chats.slice(0, 100).forEach(function (c) {
                var row = document.createElement('div'); row.className = 'hp-row';
                var info = document.createElement('div'); info.className = 'hp-info';
                var ttl = document.createElement('b'); ttl.textContent = c.title || 'Chat';
                var sub = document.createElement('span');
                var d = new Date(c.updated || c.created || Date.now());
                sub.textContent = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit' }) +
                    ' · ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) +
                    ' · ' + c.msgs.length + ' message' + (c.msgs.length === 1 ? '' : 's');
                info.appendChild(ttl); info.appendChild(sub);
                var openB = document.createElement('button'); openB.className = 'hp-open'; openB.textContent = 'Open';
                openB.onclick = function () { loadChat(c); };
                var delB = document.createElement('button'); delB.className = 'hp-del'; delB.textContent = 'Delete';
                delB.title = 'Delete this chat';
                delB.onclick = function () { ChatStore.del(c.id, renderHist); };
                row.appendChild(info); row.appendChild(openB); row.appendChild(delB);
                el.appendChild(row);
            });
        });
    }
    function loadChat(c) {
        curChat = c;
        chat.innerHTML = ''; chipsEl.innerHTML = '';
        MEM.turns = []; MEM.lastTag = null; MEM.lastTime = 0;
        c.msgs.forEach(function (m) { addMsg(m.role === 'me' ? 'me' : 'bot', m.text, true); });
        document.getElementById('histOv').classList.remove('show');
    }
    ChatStore.open();

    function addMsg(cls, text, instant) {
        var d = document.createElement('div');
        d.className = 'msg ' + cls;
        var c = document.createElement('div');
        c.className = 'mbody';
        d.appendChild(c);
        var ts = document.createElement('span');                       // v6: timestamp
        ts.className = 'time';
        ts.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        d.appendChild(ts);
        chat.appendChild(d);
        if (instant || cls === 'me') {
            if (cls === 'bot' && instant) { try { c.innerHTML = mdRender(text); } catch (e) { c.textContent = text; } }
            else c.textContent = text;
            scroll(); return;
        }
        // stream the bot's answer — adaptive speed so long answers don't crawl (~2.5s max)
        var i = 0, chunk = Math.max(2, Math.ceil(text.length / 175));
        (function step() {
            i += chunk;
            c.textContent = text.slice(0, i);
            scroll();
            if (i < text.length) setTimeout(step, 14);
            else {
                try { c.innerHTML = mdRender(text); } catch (e) { c.textContent = text; }
                var cp = document.createElement('button');                    // v17: copy button (SVG)
                cp.className = 'copybtn'; cp.innerHTML = COPY_ICON + '<span>Copy</span>';
                cp.onclick = function () {
                    var sp = cp.querySelector('span');
                    var done = function () { sp.textContent = 'Copied'; setTimeout(function () { sp.textContent = 'Copy'; }, 1400); };
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
                        else done();
                    } catch (e2) { done(); }
                };
                d.insertBefore(cp, ts);
                scroll();
            }
        })();
    }
    function scroll() { chat.scrollTop = chat.scrollHeight; }
    function showChips(list) {
        chipsEl.innerHTML = '';
        list.forEach(function (q) {
            var c = document.createElement('div');
            c.className = 'chip'; c.textContent = q;
            c.onclick = function () { chipsEl.innerHTML = ''; send(q); };

        });
    }
    /* ── v17: first-run model modal · BitLM download overlay · error banner ── */
    var modelOv = document.getElementById('modelOv'),
        moGo = document.getElementById('moGo'),
        moReq = document.getElementById('moReq'),
        dlOv = document.getElementById('dlOv'),
        errBanner = document.getElementById('errBanner');
    var moPick = null, PRO_CTX_NOTED = false;
    var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg>';
    function moSelect(ch) {
        moPick = ch;
        document.getElementById('cardBitlm').classList.toggle('sel', ch === 'bitlm');
        document.getElementById('cardBitbot').classList.toggle('sel', ch === 'bitbot');
        moGo.disabled = false;
        moReq.textContent = '';
    }
    document.getElementById('cardBitlm').onclick = function () { moSelect('bitlm'); };
    document.getElementById('cardBitbot').onclick = function () { moSelect('bitbot'); };
    function showModelModal(first) {
        moPick = modelChoice() || null;
        if (moPick) moSelect(moPick); else moGo.disabled = true;
        moGo.textContent = first ? 'Continue' : 'Switch';
        modelOv.classList.add('show');
    }
    moGo.onclick = function () {
        if (!moPick) return;
        var ch = moPick;
        if (ch === 'bitlm' && !(window.BitLMPro && BitLMPro.webgpuOK())) {
            moReq.textContent = 'BitLM needs a WebGPU-capable browser (Chrome/Edge 113+ with a GPU) — not available here, so BitBot was selected. BitBot is instant and works offline; everything still works.';
            moSelect('bitbot');
            try { localStorage.setItem('bb_model_choice', 'bitbot'); } catch (e) {}
            return;
        }
        modelOv.classList.remove('show');
        try { localStorage.setItem('bb_model_choice', ch); } catch (e) {}
        if (ch === 'bitlm') { dlStart(); return; }
        if (!chat.childNodes.length) greet();
        var t = chooseModel('bitbot'); addMsg('bot', t, false); chatAdd('bot', t);
    };
    document.getElementById('modelBtn').onclick = function () { showModelModal(false); };
    function dlStart() {
        var mm = (window.BitLMPro && BitLMPro.MODELS[proModel()]) || { name: 'BitLM', dlMB: 400 };
        var pc = document.getElementById('dlpct'), fl = document.getElementById('dlfill'),
            mb = document.getElementById('dlmb'), st = document.getElementById('dlstep');
        document.getElementById('dlTitle').textContent = 'Downloading ' + mm.name + '…';
        pc.textContent = '0%'; fl.style.width = '0%';
        mb.textContent = '0 MB of ' + mm.dlMB + ' MB';
        st.textContent = 'connecting…';
        dlOv.classList.add('show');
        proEngine(function (p) {
            var f = Math.max(0, Math.min(1, p.progress || 0));
            pc.textContent = Math.round(f * 100) + '%';
            fl.style.width = (f * 100) + '%';
            mb.textContent = Math.round(f * mm.dlMB) + ' MB of ' + mm.dlMB + ' MB';
            if (p.text) st.textContent = String(p.text).slice(0, 90);
        }).then(function () {
            dlOv.classList.remove('show');
            if (!chat.childNodes.length) greet();
            var t = chooseModel('bitlm'); addMsg('bot', t, false); chatAdd('bot', t);
        }).catch(function (e) {
            dlOv.classList.remove('show');
            try { localStorage.setItem('bb_model_choice', 'bitbot'); } catch (e2) {}
            showErr('BitLM could not load: ' + String((e && e.message) || e).slice(0, 140) + ' — switched to BitBot so nothing is broken.');
            if (!chat.childNodes.length) greet();
        });
    }
    document.getElementById('dlCancel').onclick = function () {
        dlOv.classList.remove('show');
        try { localStorage.setItem('bb_model_choice', 'bitbot'); } catch (e) {}
        if (!chat.childNodes.length) greet();
        var t = chooseModel('bitbot'); addMsg('bot', t, false); chatAdd('bot', t);
    };
    function showErr(txt) {
        var t = document.getElementById('errText');
        if (t) t.textContent = txt;
        if (errBanner) { errBanner.classList.add('show'); clearTimeout(showErr._t); showErr._t = setTimeout(hideErr, 9000); }
    }
    function hideErr() { if (errBanner) errBanner.classList.remove('show'); }
    var errCloseB = document.getElementById('errClose');
    if (errCloseB) errCloseB.onclick = hideErr;
    window.addEventListener('error', function (e) { showErr('Something broke: ' + ((e && e.message) || 'unknown') + '. The bot still works — if not, reload the page.'); });
    window.addEventListener('unhandledrejection', function (e) { showErr('Background task failed: ' + String((e && e.reason && e.reason.message) || (e && e.reason) || '').slice(0, 140)); });

    function greet() {
        var h = new Date().getHours();
        var tod = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Up late";
        var lakh = (typeof PARAMS === 'number' && PARAMS > 100000) ? (PARAMS / 100000).toFixed(1).replace(/\.0$/, '') : '79';
        var topics = (typeof vocabInfo !== 'undefined' && vocabInfo && vocabInfo.tags) ? vocabInfo.tags.length : 347;
        var modeLine = modelChoice() === 'bitlm'
            ? "\n\n**BitLM mode ON** — the large model answers daily-work questions; pure maths still snaps to the exact engines. Say **\"switch to bitbot\"** to change."
            : "";
        addMsg("bot", (userName
            ? "**" + tod + ", " + userName + "!** Welcome back — I remembered you.\n"
            : "**" + tod + "!** ") +
            "I'm **BitBot v17** by **Anurag** — Arcade Hub's assistant and your **Class 1–8 Maths Master**:\n" +
            "- **Algebra engine** — equations & identities with full steps + verification: try `2x + 3 = 11` or `expand (a+b)²`\n" +
            "- **Word-problem solver** — ages, speed–distance–time, work–time, profit-loss-GST, SI/CI, mensuration, probability — all 16 Class-8 chapters\n" +
            "- **" + lakh + "-lakh-parameter neural brain** · **" + topics + " topics** (science, SST, ICT, esports) · chain-of-thought · quiz mode" + modeLine + "\n" +
            (userName ? "" : "\nTell me your name — I'll remember it."), false);
        showChips(["solve 2x + 3 = 11", "expand (a+b)²", "CI on 10000 at 10% for 2 years", "Quiz me"]);
    }
    /* ── v16: BitLM Pro — the BIG in-browser model (WebLLM/WebGPU, <500M params,
          rebranded, identity: BitLM by Anurag). Mini-RAG grounds it in BitBot's
          KB; <calc> javascript console gives it exact maths; think-stream UI. ── */
    var PRO_HIST = [], PRO_ENGINE = null, PRO_LOADING = null;
    function modelChoice() { try { return localStorage.getItem('bb_model_choice') || ''; } catch (e) { return ''; } }
    function proModel() { try { var m = localStorage.getItem('bb_pro_model'); return (m === 'lite' || m === 'max') ? m : 'max'; } catch (e) { return 'max'; } }
    function chooseModel(ch) {
        if (ch === 'bitlm' && !(window.BitLMPro && BitLMPro.webgpuOK())) {
            try { localStorage.setItem('bb_model_choice', 'bitbot'); } catch (e) {}
            return 'You picked **BitLM** — but this browser has **no WebGPU** (the large model runs on YOUR GPU; needs Chrome/Edge 113+, and works best on the hosted site **https://bittuhere.github.io** — file:// pages cannot cache the model).\n\nSo I kept you on **BitBot** — instant, offline, everything works. On a WebGPU browser just say **"switch to bitlm"**.';
        }
        try { localStorage.setItem('bb_model_choice', ch); } catch (e) {}
        if (ch === 'bitlm') {
            cot('model choice → BitLM (large, in-browser)');
            var m = (window.BitLMPro && BitLMPro.MODELS[proModel()]) || { name: 'BitLM Max', paramsM: 494, dlMB: 400 };
            return '**BitLM selected — large language AI mode.** (' + m.name + ', ' + (m.paramsM / 10) + ' crore params)\n\n' +
                'The model downloads once (~' + m.dlMB + ' MB) and is cached — after that everything runs **offline in your browser**. Developer: **Anurag**.\n\n' +
                '- Pure maths still snaps to the exact engines (faster and perfect)\n' +
                '- BitLM has a **javascript console** — it calculates with `<calc>` and shows results\n' +
                '- Its thinking streams in a collapsible box; answers render as **markdown**\n' +
                '- Say **"switch to bitbot"** for the mini assistant, **"bitlm lite"** for the smaller/faster model';
        }
        cot('model choice → BitBot (mini assistant)');
        return '**BitBot selected — miniature personal assistant mode.** Instant and offline:\n\n' +
            '- Class 1–8 Maths Master — algebra, word problems, all 16 chapters, exact engines\n' +
            '- Arcade Hub guide — I know bittuhere.github.io inside out\n' +
            '- 82-lakh-param brain · 347 topics · chain-of-thought · quiz mode\n\n' +
            'Say **"switch to bitlm"** anytime for the large daily-work model.';
    }
    function handleProCommand(pc) {
        if (!pc) return null;
        if (pc.type === 'switch') return chooseModel(pc.to);
        if (pc.type === 'ask') {
            var cur = modelChoice();
            return '**Current model: ' + (cur === 'bitlm' ? 'BitLM (large, in-browser)' : cur === 'bitbot' ? 'BitBot (mini assistant)' : 'not chosen yet') + '.**\n\n' +
                '- **BitLM** — large language AI for daily works (runs on your GPU, ~400 MB one-time)\n' +
                '- **BitBot** — miniature from-scratch Arcade Hub assistant + exact Class 1–8 maths (~17 MB, included)\n\n' +
                'Say **"switch to bitlm"** or **"switch to bitbot"**, or use the switch button in the header. BitLM sizes: **"bitlm max"** (49.4 cr) / **"bitlm lite"** (36 cr).';
        }
        if (pc.type === 'size') {
            try { localStorage.setItem('bb_pro_model', pc.size); } catch (e) {}
            PRO_ENGINE = null; PRO_LOADING = null;
            var m = BitLMPro.MODELS[pc.size] || BitLMPro.MODELS.max;
            return '**BitLM size set: ' + m.name + '** (' + (m.paramsM / 10) + ' crore params, ~' + m.dlMB + ' MB one-time download). It loads on your next message.';
        }
        if (pc.type === 'load') {
            if (modelChoice() !== 'bitlm') return 'BitLM is not your active model — say **"switch to bitlm"** first.';
            proWarm();
            return 'Warming up BitLM — watch the progress…';
        }
        return null;
    }
    function proEngine(onProg) {
        if (PRO_ENGINE) return Promise.resolve(PRO_ENGINE);
        if (!window.BitLMPro || !BitLMPro.webgpuOK()) return Promise.reject(new Error('WebGPU is not available in this browser'));
        if (!PRO_LOADING) {
            PRO_LOADING = BitLMPro.loadEngine(proModel(), onProg).then(function (e) { PRO_ENGINE = e; return e; })
                .catch(function (e) { PRO_LOADING = null; throw e; });
        }
        return PRO_LOADING;
    }
    function proWarm() {
        proEngine(function (p) {
            if (typeof statusEl !== 'undefined' && statusEl) statusEl.classList.add('busy');
            if (typeof statusTxt !== 'undefined' && statusTxt) statusTxt.textContent = 'BitLM ' + Math.round((p.progress || 0) * 100) + '%';
        }).then(function () {
            if (typeof statusEl !== 'undefined' && statusEl) statusEl.classList.remove('busy');
            if (typeof statusTxt !== 'undefined' && statusTxt) { statusTxt.textContent = 'BitLM ready'; setTimeout(function () { statusTxt.textContent = 'ready'; }, 2600); }
        }).catch(function (e) {
            if (typeof statusEl !== 'undefined' && statusEl) statusEl.classList.remove('busy');
            if (typeof statusTxt !== 'undefined' && statusTxt) statusTxt.textContent = 'BitLM failed: ' + String((e && e.message) || e).slice(0, 60);
        });
    }
    function proEngine(onProg) {
        if (PRO_ENGINE) return Promise.resolve(PRO_ENGINE);
        if (!window.BitLMPro || !BitLMPro.webgpuOK()) return Promise.reject(new Error('WebGPU is not available in this browser'));
        if (!PRO_LOADING) {
            PRO_LOADING = BitLMPro.loadEngine(proModel(), onProg).then(function (e) { PRO_ENGINE = e; return e; })
                .catch(function (e) { PRO_LOADING = null; throw e; });
        }
        return PRO_LOADING;
    }
    function proWarm() {
        proEngine(function (p) {
            if (typeof statusEl !== 'undefined' && statusEl) statusEl.classList.add('busy');
            if (typeof statusTxt !== 'undefined' && statusTxt) statusTxt.textContent = 'BitLM ' + Math.round((p.progress || 0) * 100) + '%';
        }).then(function () {
            if (typeof statusEl !== 'undefined' && statusEl) statusEl.classList.remove('busy');
            if (typeof statusTxt !== 'undefined' && statusTxt) { statusTxt.textContent = 'BitLM ready 🧠'; setTimeout(function () { statusTxt.textContent = 'online'; }, 2600); }
        }).catch(function (e) {
            if (typeof statusEl !== 'undefined' && statusEl) statusEl.classList.remove('busy');
            if (typeof statusTxt !== 'undefined' && statusTxt) statusTxt.textContent = 'BitLM failed: ' + String((e && e.message) || e).slice(0, 60);
        });
    }
    function proBubble() {
        var d = document.createElement('div');
        d.className = 'msg bot';
        var c = document.createElement('div');
        c.className = 'mbody';
        var det = document.createElement('details');
        det.className = 'prothink';
        var sum = document.createElement('summary');
        sum.textContent = 'Thinking…';
        var tb = document.createElement('div');
        tb.className = 'thinkbody';
        det.appendChild(sum); det.appendChild(tb);
        var st = document.createElement('div'); st.className = 'prostatus';
        var ans = document.createElement('div'); ans.className = 'proans';
        c.appendChild(det); c.appendChild(st); c.appendChild(ans);
        var ts = document.createElement('span'); ts.className = 'time';
        ts.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        d.appendChild(c); d.appendChild(ts);
        chat.appendChild(d);
        det.open = true;
        scroll();
        return { node: d, det: det, sum: sum, think: tb, status: st, ans: ans, ts: ts };
    }
    function proStatus(b, txt) { if (!b) return; b.status.textContent = txt || ''; b.status.style.display = txt ? '' : 'none'; }
    function proRender(b, p) {
        if (!b) return;
        b.think.textContent = (p.think || '') + (p.tailCalc !== null && p.tailCalc !== undefined ? '\nconsole: ' + p.tailCalc + ' …' : '');
        if (p.think) b.sum.textContent = 'Thinking… (click to collapse)';
        try { b.ans.innerHTML = mdRender(p.answer || ''); } catch (e) { b.ans.textContent = p.answer || ''; }
        scroll();
    }
    function proFinish(b, res) {
        if (!b) return;
        b.det.open = false;
        b.sum.textContent = 'Thought for a moment' + (res.calcLog && res.calcLog.length ? ' · console used ' + res.calcLog.length + '×' : '');
        if (res.calcLog && res.calcLog.length) {
            var lg = document.createElement('div');
            lg.className = 'calclog';
            lg.textContent = res.calcLog.map(function (c) { return 'console: ' + c.expr + ' = ' + (c.ok ? c.value : 'ERROR'); }).join('\n');
            b.det.appendChild(lg);
        }
        var finalText = (res.answer && res.answer.trim()) ? res.answer : '(BitLM produced no answer — please try again, or say "switch to bitbot".)';
        try { b.ans.innerHTML = mdRender(finalText); } catch (e) { b.ans.textContent = finalText; }
        var cp = document.createElement('button');
        cp.className = 'copybtn'; cp.innerHTML = COPY_ICON + '<span>Copy</span>';
        cp.onclick = function () {
            var sp = cp.querySelector('span');
            var done = function () { sp.textContent = 'Copied'; setTimeout(function () { sp.textContent = 'Copy'; }, 1400); };
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(finalText).then(done, done);
                else done();
            } catch (e2) { done(); }
        };
        b.node.insertBefore(cp, b.ts);
        scroll();
        return finalText;
    }
    function proWeak(ans) {                                   // engine answer too weak → let BitLM try
        if (!ans) return true;
        return /^(🤔|Hmm|Give me a math)/.test(ans) || ans.indexOf('Not fully sure') !== -1 ||
            ans.indexOf('went over my head') !== -1 || ans.indexOf('neurons hiccuped') !== -1 ||
            ans.indexOf('🎨 **BitLM-mini') !== -1;
    }
    async function proStream(text) {
        var bubble = null;
        typingEl.classList.add('show'); scroll();
        try {
            if (text.length > 8000) {                                          // v17: context hard limit
                typingEl.classList.remove('show');
                var tl = 'That message is longer than my context limit (8000 characters). Please split it into smaller parts, or start a **new chat**.';
                addMsg('bot', tl, false); chatAdd('bot', tl);
                return;
            }
            var sys = BitLMPro.buildSystem({ userName: userName, model: proModel() });
            var tr = BitLMPro.trimHistory(PRO_HIST, 12000);                    // v17: context compactor
            if (tr.dropped && !PRO_CTX_NOTED) {
                PRO_CTX_NOTED = true;
                var cn = '**Context compacted** — oldest messages were dropped to stay inside the model limit. For a fresh topic, start a **new chat**.';
                addMsg('bot', cn, true); chatAdd('bot', cn);
            }
            var msgs = [{ role: 'system', content: sys }].concat(tr.hist.slice(-10), [{ role: 'user', content: text }]);
            bubble = proBubble();
            typingEl.classList.remove('show');
            var mm = BitLMPro.MODELS[proModel()] || BitLMPro.MODELS.max;
            var eng = await proEngine(function (p) {
                var f = Math.max(0, Math.min(1, p.progress || 0));
                proStatus(bubble, 'Downloading ' + mm.name + ' (one-time)… ' + Math.round(f * 100) + '% · ' + Math.round(f * mm.dlMB) + ' MB of ' + mm.dlMB + ' MB');
            });
            proStatus(bubble, null);
            var lastRender = 0;
            var res = await BitLMPro.chat(eng, msgs, {
                maxTokens: 700,
                onChunk: function (p) {
                    var now = Date.now();
                    if (now - lastRender > 110) { lastRender = now; proRender(bubble, p); }
                }
            });
            var finalText = proFinish(bubble, res);
            PRO_HIST.push({ role: 'user', content: text }, { role: 'assistant', content: finalText });
            if (PRO_HIST.length > 14) PRO_HIST = PRO_HIST.slice(-14);
            chatAdd('bot', finalText);
        } catch (e) {
            typingEl.classList.remove('show');
            if (bubble && bubble.node && bubble.node.parentNode) bubble.node.parentNode.removeChild(bubble.node);
            var msg = '**BitLM could not run here:** ' + String((e && e.message) || e).slice(0, 200) + '\n\nBitLM needs **WebGPU** (Chrome/Edge 113+ with a GPU) and works best on the **hosted site** (https://bittuhere.github.io) — not from file://. It also needs internet once for the model download.\n\nMeanwhile BitBot can still answer everything — say **"switch to bitbot"**, or ask me right now.';
            addMsg('bot', msg, false); chatAdd('bot', msg);
        }
    }
    function proSend(text) {
        // commands + selector answers keep working in BitLM mode
        if (BitLMPro.isProCommand(text)) {
            typingEl.classList.add('show');
            setTimeout(function () {
                typingEl.classList.remove('show');
                var a; try { a = respond(text); } catch (e) { a = 'Oops — hiccup! 🤯'; }
                showThinking(COT.slice(), function () { addMsg('bot', a, false); chatAdd('bot', a); });
            }, 260);
            return;
        }
        // pure maths → exact engine first (instant + perfect); BitLM catches weak answers
        if (BitLMPro.looksPureMath(text)) {
            var ans = null;
            try { ans = respond(text); } catch (eM) { ans = null; }
            if (!proWeak(ans)) {
                typingEl.classList.add('show');
                setTimeout(function () {
                    typingEl.classList.remove('show');
                    showThinking(COT.slice(), function () { addMsg('bot', ans, false); chatAdd('bot', ans); });
                }, 250);
                return;
            }
        }
        proStream(text);
    }
    function send(text) {
        text = (text || '').trim();
        if (!text || !net) return;
        addMsg('me', text);
        chatAdd('me', text);
        inp.value = '';
        if (window.BitLMPro && modelChoice() === 'bitlm') { proSend(text); return; }   // v16: BitLM mode
        typingEl.classList.add('show'); scroll();
        setTimeout(function () {
            typingEl.classList.remove('show');
            var ans;
            try { ans = respond(text); }                                        // v6: never crash on a bug
            catch (e) { ans = "Oops — my neurons hiccuped! 🤯 Ask me again, maybe in simpler words?"; }
            showThinking(COT.slice(), function () { addMsg('bot', ans, false); chatAdd('bot', ans); });   // v7: CoT first · v14: auto-save
        }, 420 + Math.random() * 500);
    }

    document.getElementById('clearBtn').onclick = function () {           // v6: fresh chat · v14: previous one stays saved
        clearTimeout(chatSaveT); ChatStore.put(curChat);                  // flush the old session first
        newChat();
        chat.innerHTML = ''; chipsEl.innerHTML = '';
        MEM.turns = []; MEM.lastTag = null; MEM.lastTime = 0; MEM.used = {}; MEM.quiz = null;
        greet();
    };
    document.getElementById('histBtn').onclick = function () {            // v14: saved chats panel
        clearTimeout(chatSaveT); ChatStore.put(curChat);                  // make sure current chat is in the list
        renderHist();
        document.getElementById('histOv').classList.add('show');
    };
    document.getElementById('histClose').onclick = function () {
        document.getElementById('histOv').classList.remove('show');
    };
    document.getElementById('histOv').addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('show');
    });
    document.getElementById('send').onclick = function () { send(inp.value); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(inp.value); });
    if (window.__AI_DEPS_READY) boot();
    else window.addEventListener('ai-deps-ready', boot, { once: true });
})();
</script>
