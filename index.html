<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0b22">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>BitBot — Arcade Hub AI Assistant (beta)</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: radial-gradient(1200px 700px at 70% -10%, #1b1440 0%, #0d0b22 55%, #070510 100%);
        color: #e8ecf4; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
        flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 14px 18px;
        background: rgba(20, 25, 36, .8); border-bottom: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(8px);
    }
    .ava {
        width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
        background: conic-gradient(from 210deg, #00f3ff, #818cf8, #ff00ff, #00f3ff);
        display: flex; align-items: center; justify-content: center; font-size: 1.35rem;
        box-shadow: 0 0 22px rgba(0,243,255,.45); animation: spin 9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ava > span { animation: spin 9s linear infinite reverse; }
    header h1 { font-family: 'Teko', 'Segoe UI', sans-serif; font-size: 1.55rem; letter-spacing: 1.5px; line-height: 1; }
    header .sub { font-size: .68rem; color: #9aa5b5; letter-spacing: .4px; }
    #ver { position: fixed; left: 10px; bottom: 8px; font-size: .6rem; color: #4b5563; letter-spacing: 1px; z-index: 5; }
    #status { margin-left: auto; font-size: .7rem; color: #34d399; display: flex; align-items: center; gap: 6px; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; }
    #status.busy { color: #fbbf24; } #status.busy .dot { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }

    #chat { flex: 1; overflow-y: auto; padding: 18px 6%; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 11px 15px; border-radius: 16px; font-size: .93rem; line-height: 1.5;
           animation: pop .22s cubic-bezier(.2,.9,.3,1.2) both; word-wrap: break-word; white-space: pre-wrap; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    .bot  { align-self: flex-start; background: #1a2130; border: 1px solid rgba(255,255,255,.09); border-bottom-left-radius: 5px; }
    .me   { align-self: flex-end; background: linear-gradient(45deg, #0891b2, #2563eb); border-bottom-right-radius: 5px; }
    .msg b { color: #7dd3fc; }
    .msg i { color: #c7d2fe; }
    .msg code { background: rgba(0,243,255,.08); border: 1px solid rgba(0,243,255,.22); padding: 1px 6px; border-radius: 6px; font-family: Consolas, 'Courier New', monospace; font-size: .85em; color: #7dd3fc; }
    .msg pre { background: #0b0f1a; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
    .msg pre code { border: none; background: none; padding: 0; }
    .msg h3, .msg h4 { color: #7dd3fc; margin: 8px 0 3px; font-size: .95rem; letter-spacing: .3px; }
    .msg ul, .msg ol { margin: 6px 0 6px 4px; padding-left: 18px; }
    .msg li { margin: 3px 0; }
    .msg a { color: #7dd3fc; text-decoration: underline; }
    .msg .sp { height: .5em; }
    .typing { align-self: flex-start; display: none; gap: 5px; padding: 13px 16px; background: #1a2130; border-radius: 16px; border-bottom-left-radius: 5px; }
    .typing.show { display: flex; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: #7dd3fc; animation: blink 1s infinite; }
    .typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 6% 8px; }
    .chip { padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(0,243,255,.35);
            background: rgba(0,243,255,.07); color: #a5e8ff; font-size: .78rem; cursor: pointer; transition: .15s; }
    .chip:hover { background: rgba(0,243,255,.2); transform: translateY(-1px); }

    footer { flex-shrink: 0; display: flex; gap: 9px; padding: 12px 6% max(14px, env(safe-area-inset-bottom));
             background: rgba(20,25,36,.85); border-top: 1px solid rgba(255,255,255,.09); }
    #inp { flex: 1; padding: 13px 17px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.13);
           background: #141924; color: #e8ecf4; outline: none; font-family: inherit; font-size: .93rem; min-width: 0; }
    #inp:focus { border-color: rgba(0,243,255,.55); box-shadow: 0 0 0 4px rgba(0,243,255,.1); }
    #send { width: 46px; height: 46px; border: none; border-radius: 50%; background: linear-gradient(45deg,#06b6d4,#3b82f6);
            color: #fff; font-size: 1.1rem; cursor: pointer; transition: .15s; flex-shrink: 0; }
    #send:hover { transform: scale(1.09); box-shadow: 0 0 18px rgba(6,182,212,.5); }

    /* training overlay */
    #trainOv { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; gap: 14px;
               align-items: center; justify-content: center; background: rgba(7,5,16,.92); backdrop-filter: blur(6px); }
    #trainOv.show { display: flex; }
    #trainOv h2 { font-family: 'Teko','Segoe UI',sans-serif; font-size: 2rem; letter-spacing: 2px; color: #7dd3fc; }
    #trainOv .bar { width: min(78vw, 380px); height: 8px; background: rgba(255,255,255,.09); border-radius: 8px; overflow: hidden; }
    #trainOv .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#06b6d4,#818cf8); border-radius: 8px; transition: width .12s; }
    #trainStats { font-size: .78rem; color: #9aa5b5; line-height: 1.8; text-align: center; }
    /* loader (v6) */
    #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
              background: radial-gradient(1200px 700px at 70% -10%, #1b1440 0%, #0d0b22 55%, #070510 100%); transition: opacity .6s; }
    #loader.hide { opacity: 0; pointer-events: none; }
    .lring { width: 94px; height: 94px; border-radius: 50%; background: conic-gradient(#00f3ff, #818cf8, #ff00ff, #00f3ff);
             animation: lspin 1.5s linear infinite; box-shadow: 0 0 36px rgba(0,243,255,.4); display: flex; align-items: center; justify-content: center; }
    .lava { width: 78px; height: 78px; border-radius: 50%; background: #0d0b22; display: flex; align-items: center; justify-content: center; font-size: 2.1rem; animation: lspin 1.5s linear infinite reverse; }
    @keyframes lspin { to { transform: rotate(360deg); } }
    .lpct { font-family: 'Teko', 'Segoe UI', sans-serif; font-size: 2.3rem; color: #7dd3fc; letter-spacing: 2px; line-height: 1; text-shadow: 0 0 18px rgba(125,211,252,.45); }
    .lbar { width: min(72vw, 320px); height: 7px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; }
    .lfill { height: 100%; width: 0%; border-radius: 8px; background: linear-gradient(90deg, #06b6d4, #818cf8, #ff00ff, #06b6d4); background-size: 200% 100%;
             animation: lshimmer 1.3s linear infinite; transition: width .5s cubic-bezier(.3,.8,.4,1); box-shadow: 0 0 14px rgba(6,182,212,.6); }
    @keyframes lshimmer { to { background-position: -200% 0; } }
    .lstep { font-size: .74rem; color: #9aa5b5; letter-spacing: .6px; min-height: 1.1em; transition: opacity .25s; }

    /* timestamps + clear chat (v6) */
    .msg .time { display: block; font-size: .58rem; color: #5b6472; margin-top: 5px; text-align: right; letter-spacing: .4px; }
    .me .time { color: rgba(255,255,255,.5); }
    #clearBtn { margin-left: 8px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
                background: rgba(255,255,255,.05); color: #9aa5b5; font-size: 1.05rem; cursor: pointer; transition: .2s; flex-shrink: 0; }
    #clearBtn:hover { color: #7dd3fc; border-color: rgba(0,243,255,.5); transform: rotate(-180deg); }

    #trainBtn { position: fixed; right: 14px; bottom: 84px; z-index: 40; padding: 9px 15px; border-radius: 999px;
                border: 1px solid rgba(129,140,248,.5); background: rgba(20,25,36,.9); color: #b6bdff;
                font-size: .72rem; cursor: pointer; }
    #trainBtn:hover { background: rgba(129,140,248,.2); }
</style>

<body>
<div id="loader">
    <div class="lring"><div class="lava">🤖</div></div>

<script>
/* BitBot loader (v6) — REAL progress: every % step is an actual file load. */
(function () {
    var pct = 0, target = 0, el = null, fill = null, step = null;
    function setP(p, label) {
        target = p;
        if (label && step) {
            step.style.opacity = 0;
            setTimeout(function () { step.textContent = label; step.style.opacity = 1; }, 160);
        }
    }
    window.__setLoad = setP;
    window.__loaderDone = function () {
        setP(100, 'ready! 🚀');
        setTimeout(function () {
            var l = document.getElementById('loader');
            if (l) { l.classList.add('hide'); setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 700); }
        }, 400);
    };
    function tick() {
        pct += (target - pct) * 0.14;
        if (Math.abs(target - pct) < 0.4) pct = target;
        if (el) el.textContent = Math.floor(pct) + '%';
        if (fill) fill.style.width = pct + '%';
        requestAnimationFrame(tick);
    }
    document.addEventListener('DOMContentLoaded', function () {
        el = document.getElementById('lpct'); fill = document.getElementById('lfill'); step = document.getElementById('lstep');
        requestAnimationFrame(tick);
        setP(6, 'starting neural core…');
        var files = [
            ['brain.js?v=7',   26, 'loading my brain engine…'],
            ['data.js?v=7',    56, 'loading knowledge — 124 topics…'],
            ['weights.js?v=7', 90, 'loading weights — all my memories…']
        ];
        var i = 0;
        function loadCurrent(tries) {
            var f = files[i];
            var s = document.createElement('script');
            s.src = f[0];
            s.onload = function () { setP(f[1], f[2]); i++; setTimeout(loadStep, 140); };
            s.onerror = function () {
                if (tries < 2) setTimeout(function () { loadCurrent(tries + 1); }, 900);
                else if (step) step.textContent = 'could not load ' + f[0] + ' — please refresh the page';
            };
            document.head.appendChild(s);
        }
        function loadStep() {
            if (i < files.length) { loadCurrent(0); return; }
            setP(95, 'building neural net…');
            window.__AI_DEPS_READY = true;
            window.dispatchEvent(new Event('ai-deps-ready'));
        }
        loadStep();
    });
})();
</script>
<script>
(function () {
    'use strict';
    var chat = document.getElementById('chat'),
        inp = document.getElementById('inp'),
        typingEl = document.getElementById('typing'),
        chipsEl = document.getElementById('chips'),
        statusEl = document.getElementById('status'),
        statusTxt = document.getElementById('statusTxt');

    // ── boot: pre-trained weights (instant) ────────────────────────────────
    var net = null, vocabInfo = null, trainer = null;
    var THRESHOLD = 0.42;
    var lastGame = null;

    function boot() {
        try {
            net = BitBrain.Net.load(window.BITBOT_WEIGHTS.net);
            vocabInfo = window.BITBOT_WEIGHTS.vocab;
            vocabInfo.index = {};                                  // rebuild word→idx map
            vocabInfo.words.forEach(function (w, i) { vocabInfo.index[w] = i; });
            document.getElementById('brainspec').textContent =
                vocabInfo.words.length + '→' + net.H + '→' + net.N + ' · ' +
                (net.W1.length + net.b1.length + net.W2.length + net.b2.length).toLocaleString() + ' params';
            PARAMS = net.W1.length + net.b1.length + net.W2.length + net.b2.length;
            statusTxt.textContent = 'neural net ready';
            statusEl.classList.remove('busy');
            greet();
            if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {   // v6: offline cache
                navigator.serviceWorker.register('./sw.js').catch(function () {});
            }
            if (window.__loaderDone) window.__loaderDone();
        } catch (e) {
            statusTxt.textContent = 'boot error: ' + e.message;
            if (window.__loaderDone) window.__loaderDone();
        }
    }

    function predict(text) {
        var x = BitBrain.bag(text, vocabInfo);
        var p = net.forward(x).p, best = 0;
        for (var i = 1; i < p.length; i++) if (p[i] > p[best]) best = i;
        return { tag: vocabInfo.tags[best], prob: p[best] };
    }

    // ── entity extraction (slot filling) ───────────────────────────────────
    function findGame(text) {
        var t = ' ' + text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
        var best = null, bestLen = 0;
        Object.keys(BitData.GAMES).forEach(function (k) {
            BitData.GAMES[k].names.forEach(function (n) {
                if (t.indexOf(' ' + n + ' ') !== -1 && n.length > bestLen) { best = k; bestLen = n.length; }
            });
        });
        return best;
    }

    // ── the response engine ────────────────────────────────────────────────
    // ── skills data ─────────────────────────────────────────────────────
    var JOKES = [
        "Why did the snake 🐍 get banned from the arcade? It kept eating the APPLES... and the highscores!",
        "Why don't skeletons ❌ play Tic-Tac-Toe? They have no body to play with!",
        "I told my Dino 🦕 to jump the cactus. He said: 'that decision is not my reptile of function!' 😄",
        "Why was the math book sad in Fair Copies? Because it had too many problems! 📚",
        "What do you call a snake that works for the government? A civil serpent! 🐍",
        "Why did the Pac-Man ᗧ go to the dentist? Too many plaq-dot problems!",
        "My Flappy Bird 🐦 scored 3 today. A new personal worst!",
        "Why do Java developers wear glasses? Because they can't C#! 👓",
        "Why did the computer go to the doctor? It caught a VIRUS! 🦠",
        "I would tell you a UDP joke, but you might not get it. 📡",
        "Why was the smartphone wearing glasses? It lost all its CONTACTS! 👓",
        "There are 10 types of people: those who understand binary and those who don't. 🤓",
        "Why did the developer go broke? He used up all his CACHE! 💸",
        "Why did the snake apply for a job? It had SCALES of experience! 🐍",
        "What do you call a sleeping dinosaur? A dino-SNORE! 🦕",
        "Why did the phone go to school? To improve its CELL division! 📱",
        "What is a computer's favorite snack? MICRO-chips! 💻",
        "Why was the geometry book so calm? It had all the right ANGLES! 📐",
        "Why did the quiz go to therapy? Too many problems to solve! 🧠",
        "What do clouds wear under their clothes? THUNDER-wear! ⛈️",
        "Why is your nose never 12 inches long? Because then it would be a FOOT! 👃"
    ];
    var FACTS = [
        "🔬 Class 8 science: photosynthesis = plants making food from sunlight + water + CO₂ — the equation of life!",
        "⚡ Newton's 3rd law: every action has an equal & opposite reaction — like braking in Real City Drift!",
        "🌍 Light takes ~8 minutes 20 seconds to travel from the Sun to Earth.",
        "🧲 Opposite poles attract, like poles repel — the basics of magnets!",
        "🫁 Humans breathe ~20,000 times a day — your lungs never AFK!",
        "💧 Water expands when it freezes — that's why ice floats!",
        "📐 Pythagoras: a² + b² = c² — only for RIGHT-angled triangles!",
        "🧠 Your brain has ~86 billion neurons — more connections than the whole internet!",
        "♻️ Sound travels 4× faster in water than in air.",
        "🔥 Fire needs 3 things: fuel, oxygen, heat. Remove one = no fire.",
        "🦈 Sharks are older than trees — they've survived 5 mass extinctions!",
        "🇮🇳 Chess was born in India as chaturanga over 1,500 years ago — a Gupta-era invention!",
        "🌋 Kawah Ijen in Indonesia erupts ELECTRIC-BLUE flames at night — sulfur gases burning!",
        "🍯 Honey never spoils — archaeologists have tasted 3,000-year-old Egyptian honey. Still perfect!",
        "🍌 A strawberry has ~200 seeds on the OUTSIDE — that's why it's not a true berry (bananas are!)",
        "⏱️ A day on Venus is LONGER than its year — it spins that slowly!",
        "🦒 A giraffe has the same number of neck bones as you: exactly 7!",
        "🌋 There is enough gold in Earth's core to cover ALL land in 1.5 feet of gold!",
        "🐌 A snail can sleep for 3 years straight!",
        "🧊 Antarctica is the largest desert on Earth — deserts mean low rainfall, not heat!",
        "🐦 The peregrine falcon dives at 390 km/h — the fastest animal on Earth!",
        "🧠 Your brain runs on ~20 watts — enough for a dim light bulb!",
        "🍌 Banana plants are not trees — they are giant herbs!",
        "🌊 We have explored LESS of the ocean floor than the surface of Mars!",
        "🦴 Your funny bone is not a bone — it is the ulnar NERVE hitting bone!",
        "🌍 Earth is the only planet not named after a god!",
        "🐝 A bee can visit 5,000 flowers in a single day!",
        "🪐 Saturn is so light it would float in water — if you found a big enough bucket!",
        "🇮🇳 Mawsynram (Meghalaya) is the wettest place on Earth — ~11,871 mm of rain a year!"
    ];
    // ── FULL MATH (v6): tables, factorial, GCD/HCF, LCM, primes, factors,
    //    averages, percentages, mod, pi + the expression evaluator with fractions ──
    function fmtNum2(v) { var r = Math.round(v * 1e6) / 1e6; return String(r); }
    function nums(t) { var out = [], re = /-?\d+(?:\.\d+)?/g, m; while ((m = re.exec(t))) out.push(parseFloat(m[0])); return out; }
    function gcd2(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
    function isPrime(n) { if (n < 2 || n % 1) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
    function toFrac(v) {
        var sign = v < 0 ? -1 : 1; v = Math.abs(v);
        if (v > 1e6) return null;
        var bn = 0, bd = 0, be = 1e9;
        for (var d = 2; d <= 500; d++) {
            var n = Math.round(v * d);
            if (Math.abs(v - n / d) < be) { be = Math.abs(v - n / d); bn = n; bd = d; }
            if (be < 1e-9) break;
        }
        if (be > 1e-9 || bd === 1 || bn === 0) return null;
        return (sign < 0 ? '-' : '') + bn + '/' + bd;
    }
    function doMath(text) {
        var t = text.toLowerCase(), m;
        // ── special solvers ──────────────────────────────────────────
        if ((m = t.match(/table of (\d{1,2})/))) {
            var n = parseInt(m[1], 10), lines = '';
            for (var i = 1; i <= 10; i++) lines += n + ' × ' + i + ' = **' + (n * i) + '**\n';
            return '🧮 **Table of ' + n + ':**\n' + lines.trim();
        }
        if ((m = t.match(/(?:factorial of|factorial)\s*(\d{1,3})/)) || (m = t.match(/(\d{1,3})\s*!/))) {
            var f = parseInt(m[1], 10);
            if (f > 170) return 'Whoa! Factorials above 170 overflow even my biggest registers 🤯 — try a smaller number!';
            var fr = 1; for (var k = 2; k <= f; k++) fr *= k;
            return '🧮 ' + f + '! = **' + fr + '**';
        }
        if (/(\bgcd\b|\bhcf\b|greatest common)/.test(t) && nums(t).length >= 2) {
            var G = nums(t), gg = G[0]; for (var j = 1; j < G.length; j++) gg = gcd2(gg, G[j]);
            return '🧮 GCD/HCF of ' + G.join(', ') + ' = **' + gg + '**';
        }
        if (/\blcm\b|least common/.test(t) && nums(t).length >= 2) {
            var L = nums(t), ll = L[0]; for (var j2 = 1; j2 < L.length; j2++) { var a2 = ll, b2 = L[j2]; ll = a2 / gcd2(a2, b2) * b2; }
            return '🧮 LCM of ' + L.join(', ') + ' = **' + fmtNum2(ll) + '**';
        }
        if ((m = t.match(/is (\d{1,9})\s*(?:a\s*)?prime/))) {
            var p = parseInt(m[1], 10);
            if (isPrime(p)) return '✅ **' + p + ' IS prime** — divisible only by 1 and ' + p + '!';
            for (var d2 = 2; d2 * d2 <= p; d2++) if (p % d2 === 0) return '❌ **' + p + ' is NOT prime** — ' + d2 + ' × ' + (p / d2) + ' = ' + p + '.';
            return '❌ **' + p + ' is NOT prime**.';
        }
        if ((m = t.match(/factors? of (\d{1,7})/))) {
            var N = parseInt(m[1], 10), fs = [];
            for (var q = 1; q * q <= N; q++) if (N % q === 0) { fs.push(q); if (q !== N / q) fs.push(N / q); }
            fs.sort(function (a, b) { return a - b; });
            return '🧮 Factors of ' + N + ': **' + fs.join(', ') + '** (' + fs.length + ' factors)';
        }

        if (RE_WHY.test(text)) {
            if (memActive() && MEM.lastTag === "skill_joke")
                return "Bro, it's a JOKE 😂 — comedy doesn't need logic! Want another one? Just say \"more\".";
            if (memActive() && REPEATABLE[MEM.lastTag])
                return "Great question! 🤓 I memorized the WHAT, not the deep WHY — I'm a " + PARAMS.toLocaleString('en-IN') + "-parameter arcade brain, not a physics professor. But questions like yours are how scientists are made! Want another fact? Just say \"more\".";
            return "Why what? 🤔 Give me a bit more — ask about games, science, space, India GK or math!";
        }
        if (RE_DENY.test(text))
            return "My bad" + (userName ? ", " + userName : "") + "! 🙏 Try rephrasing with simpler words — or ask about games, facts, jokes or math!";
        if (isAck(text)) {
            if (memActive()) return "Glad you liked it" + (userName ? ", " + userName : "") + "! 😄 Want more of that? Just say \"more\"!";
            return "Thanks" + (userName ? ", " + userName : "") + "! 😎 I'm warmed up — ask me about games, facts, jokes or math!";
        }
        if (RE_RECAP.test(text)) {
            if (!MEM.turns.length)
                return "My memory just booted — nothing stored yet! 🧠 Ask me something (try \"tell me a fact\") and then ask me again what we talked about!";
            var seen = {}, topics = [];
            MEM.turns.forEach(function (t) { if (!seen[t.tag]) { seen[t.tag] = 1; topics.push(topicLabel(t.tag)); } });
            return "Of course — my memory works now! 🧠 We recently talked about: " + topics.slice(-6).join(", ") +
                ". Say \"more\" to continue the last one, or ask something new!";
        }
        return null;                                // not a follow-up → normal classification
    }

    function respond(text) {
        // 1) name memory first ("my name is …", "what is my name")
        var nm = handleName(text);
        if (nm !== null) return nm;

        // 2) quiz answer check (while a quiz question is active)
        var qa = quizAnswer(text);
        if (qa !== null) return qa;

        // 3) follow-ups — pure context, no neural net needed
        var f = handleFollowup(text);
        if (f !== null) return f;

        // 3) multi-question: "how to add a friend? how to open admin?" → answer BOTH
        var mq = multiAnswer(text);
        if (mq !== null) return mq;

        // 4) pronoun resolution: "how do I play it?" → the game we just discussed
        var game = findGame(text);
        var shortMsg = text.split(/\s+/).length <= 8;
        var pronounRef = !game && lastGame && (Date.now() - MEM.gameTime) < MEM_WINDOW && shortMsg && RE_PRONOUN.test(text);
        if (game) { lastGame = game; MEM.gameTime = Date.now(); }
        if (pronounRef) MEM.gameTime = Date.now();
        var r = predict(pronounRef ? text + " " + BitData.GAMES[lastGame].names[0] : text);

        // OOD guard: if most words are unknown to my vocabulary, it's
        // definitely not about Arcade Hub → honest fallback, no guessing
        var toks = BitBrain.tokenize(text).map(BitBrain.stem);
        var known = 0;
        toks.forEach(function (w) { if (vocabInfo.index[w] !== undefined) known++; });
        var coverage = toks.length ? known / toks.length : 0;

        if (r.prob < THRESHOLD || (coverage < 0.35 && r.prob < 0.75)) {
            // low confidence → honest fallback + suggestions (+ memory hint)
            setTimeout(function () { showChips(["Tell me a fact", "Tell me a joke", "What games are there?", "How do I add friends?"]); }, 300);
            var fb = fallbackMsg();
            if (memActive()) fb += "\n\nPS: we were just talking about " + topicLabel(MEM.lastTag) + ' — say "more" if you want more of that!';
            return fb;
        }
        return answerFor(text, r, game || (pronounRef ? lastGame : null));
    }

    // given a confident classification, produce the answer (shared with multi-question mode)
    function answerFor(text, r, game) {
        // ── SKILLS: computed live, not memorized ─────────────────────
        if (r.tag === "skill_quizme") { rememberTurn("skill_quizme"); return doQuiz(); }
        if (r.tag === "skill_convert") {
            var cv = doConvert(text);
            if (cv) { rememberTurn("skill_convert"); return cv; }
            if (!/\d/.test(text)) return fallbackMsg();     // no numbers → was a misclassification
            return 'Give me units to convert! 📐 Try "5 km to miles", "10 kg in pounds" or "100 c to f".';
        }
        if (r.tag === "skill_random") { rememberTurn("skill_random"); return doRandom(text); }
        if (r.tag === "skill_calc") {
            var cv2 = doConvert(text);
            if (cv2) { rememberTurn("skill_convert"); return cv2; }
            rememberTurn("skill_calc"); return doMath(text);
        }
        if (r.tag === "skill_time") { rememberTurn("skill_time"); return timeAnswer(); }
        if (r.tag === "skill_joke") { rememberTurn("skill_joke"); return pickFresh(JOKES, "skill_joke"); }
        if (r.tag === "study_fact") { rememberTurn("study_fact"); return pickFresh(FACTS, "study_fact"); }
        // entity-driven intents
        if (r.tag === "game_info" || r.tag === "how_to_play") {
            var g2 = game || lastGame;
            if (g2) {
                rememberTurn(r.tag);
                var g = BitData.GAMES[g2];
                return r.tag === "game_info" ? g.info : g.play;
            }
            return "Which game? 🎮 Try: car, snake, flappy, dino, pacman, tic tac toe, arcadecraft or the quiz!";
        }
        // find the intent's responses (anti-repeat cycling)
        var rs = intentResponses(r.tag);
        if (rs && rs.length) { rememberTurn(r.tag); return pickFresh(rs, r.tag); }
        return fallbackMsg();
    }

    // v5: answer MULTIPLE questions in one message ("a? b?" → both answered)
    function multiAnswer(text) {
        var parts = text.split(/[?!.]\s+/).map(function (s) { return s.trim(); })
                        .filter(function (s) { return s.length > 2; });
        if (parts.length < 2) return null;
        var answers = [], seenTags = {};
        for (var i = 0; i < parts.length && i < 3; i++) {
            var seg = parts[i];
            var toks = BitBrain.tokenize(seg).map(BitBrain.stem);
            var known = 0;
            toks.forEach(function (w) { if (vocabInfo.index[w] !== undefined) known++; });
            var coverage = toks.length ? known / toks.length : 0;
            if (coverage < 0.35) continue;
            var pr = predict(seg);
            if (pr.prob < 0.5) continue;
            if (seenTags[pr.tag]) continue;
            seenTags[pr.tag] = 1;
            var gm = findGame(seg);
            if (gm) { lastGame = gm; MEM.gameTime = Date.now(); }
            answers.push({ tag: pr.tag, ans: answerFor(seg, pr, gm || lastGame) });
        }
        if (answers.length < 2) return null;          // only 1 real question → the normal path answers it
        var out = "You asked **" + answers.length + " things**! 😄\n\n";
        answers.forEach(function (a, idx) {
            out += "**" + (idx + 1) + ")** " + a.ans + "\n\n";
        });
        rememberTurn(answers[answers.length - 1].tag);
        return out + "Ask one at a time for the full answer! 📝";
    }

    // ── MARKDOWN RENDERER (v5) ─────────────────────────────────────────────
    // BitBot answers in markdown (like real AIs); this renders it in the
    // chat: **bold**, *italic*, code, code blocks, # headings, lists, links.
    function mdInline(t) {
        return t
            .replace(/\u0060([^\u0060]+)\u0060/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
            .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<i>$2</i>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    function mdRender(src) {
        var esc = String(src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var lines = esc.split('\n');
        var out = [], inUl = false, inOl = false, inCode = false, buf = [];
        function closeList() { if (inUl) { out.push('</ul>'); inUl = false; } if (inOl) { out.push('</ol>'); inOl = false; } }
        for (var i = 0; i < lines.length; i++) {
            var ln = lines[i];
            if (/^[\u0060]{3}/.test(ln)) {
                if (inCode) { out.push('<pre><code>' + buf.join('\n') + '</code></pre>'); buf = []; inCode = false; }
                else { closeList(); inCode = true; }
                continue;
            }
            if (inCode) { buf.push(ln); continue; }
            var h = ln.match(/^(#{1,3})\s+(.*)$/);
            if (h) { closeList(); out.push('<h' + (h[1].length + 2) + '>' + mdInline(h[2]) + '</h' + (h[1].length + 2) + '>'); continue; }
            var ul = ln.match(/^[-•]\s+(.*)$/);
            var ol = ln.match(/^\d+[.)]\s+(.*)$/);
            if (ul || ol) {
                if (ul && inOl) { out.push('</ol>'); inOl = false; }
                if (ol && inUl) { out.push('</ul>'); inUl = false; }
                if (ul && !inUl) { out.push('<ul>'); inUl = true; }
                if (ol && !inOl) { out.push('<ol>'); inOl = true; }
                out.push('<li>' + mdInline(ul ? ul[1] : ol[1]) + '</li>');
                continue;
            }
            closeList();
            if (ln.trim() === '') out.push('<div class="sp"></div>');
            else out.push('<div>' + mdInline(ln) + '</div>');
        }
        closeList();
        if (inCode) out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
        return out.join('');
    }

    // ── UI ─────────────────────────────────────────────────────────────────
    function addMsg(cls, text, instant) {
        var d = document.createElement('div');
        d.className = 'msg ' + cls;
        var c = document.createElement('div');
        c.className = 'mbody';
        d.appendChild(c);
        var ts = document.createElement('span');                       // v6: timestamp
        ts.className = 'time';
        ts.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        d.appendChild(ts);
        chat.appendChild(d);
        if (instant || cls === 'me') { c.textContent = text; scroll(); return; }
        // stream the bot's answer character by character, then render markdown
        var i = 0;
        (function step() {
            i += 2;
            c.textContent = text.slice(0, i);
            scroll();
            if (i < text.length) setTimeout(step, 14);
            else { try { c.innerHTML = mdRender(text); } catch (e) { c.textContent = text; } scroll(); }
        })();
    }
    function scroll() { chat.scrollTop = chat.scrollHeight; }
    function showChips(list) {
        chipsEl.innerHTML = '';
        list.forEach(function (q) {
            var c = document.createElement('div');
            c.className = 'chip'; c.textContent = q;
            c.onclick = function () { chipsEl.innerHTML = ''; send(q); };
            chipsEl.appendChild(c);
        });
    }
    function greet() {
        var h = new Date().getHours();
        var tod = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Up late";
        addMsg("bot", userName
            ? "**" + tod + ", " + userName + "!** 👋 Welcome back — I remembered you! I'm BitBot v6: **memory + markdown + full math + quiz**. Ask me anything!"
            : "**" + tod + "!** 👋 I'm **BitBot v6** 🤖 — your arcade companion with **124 topics** of knowledge, **full math solving**, **quiz mode** and a **memory that never forgets your name**! Try \"quiz me\" — or tell me your name!", false);
        showChips(["Quiz me", "Table of 7", "Tell me a fact", "5 km to miles"]);
    }
    function send(text) {
        text = (text || '').trim();
        if (!text || !net) return;
        addMsg('me', text);
        inp.value = '';
        typingEl.classList.add('show'); scroll();
        setTimeout(function () {
            typingEl.classList.remove('show');
            var ans;
            try { ans = respond(text); }                                        // v6: never crash on a bug
            catch (e) { ans = "Oops — my neurons hiccuped! 🤯 Ask me again, maybe in simpler words?"; }
            addMsg('bot', ans, false);
        }, 420 + Math.random() * 500);
    }

    document.getElementById('clearBtn').onclick = function () {           // v6: fresh chat, instantly
        chat.innerHTML = ''; chipsEl.innerHTML = '';
        MEM.turns = []; MEM.lastTag = null; MEM.lastTime = 0; MEM.used = {}; MEM.quiz = null;
        greet();
    };
    document.getElementById('send').onclick = function () { send(inp.value); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(inp.value); });

    // ── LIVE TRAINING ("watch it learn") — chunked, non-blocking ──────────
    document.getElementById('trainBtn').onclick = function () {
        var ov = document.getElementById('trainOv'),
            fill = document.getElementById('trainFill'),
            stats = document.getElementById('trainStats');
        ov.classList.add('show');
        statusEl.classList.add('busy'); statusTxt.textContent = 'training…';
        var t = BitBrain.makeTrainer(BitData.INTENTS, { seed: 7, hidden: 40 });
        var EPOCHS = 60, e = 0, r = BitBrain.rng(4242);
        (function chunk() {
            var t0 = performance.now();
            while (e < EPOCHS && performance.now() - t0 < 28) {   // ≤28ms slices → 60fps
                var loss = t.epoch(r, e < 30 ? 0.12 : 0.05);
                if (e % 5 === 0) {
                    fill.style.width = (e / EPOCHS * 100).toFixed(0) + '%';
                    stats.innerHTML = 'epoch ' + e + '/' + EPOCHS + ' · loss ' + loss.toFixed(4) +
                        '<br>training accuracy: <b style="color:#34d399">' + (t.accuracy() * 100).toFixed(1) + '%</b>';
                }
                e++;
            }
            if (e < EPOCHS) { setTimeout(chunk, 0); return; }
            fill.style.width = '100%';
            var acc = t.accuracy();
            stats.innerHTML = '✅ Training complete!<br>final training accuracy: <b style="color:#34d399">' + (acc * 100).toFixed(1) + '%</b>' +
                '<br>weights swapped into the live net.';
            net = t.net;                                            // hot-swap the brain
            vocabInfo = t.vocab; vocabInfo.tags = t.tags;             // vocab + tag list!
            setTimeout(function () {
                ov.classList.remove('show');
                statusEl.classList.remove('busy'); statusTxt.textContent = 'self-trained ✓';
                addMsg('bot', '🧠 I just retrained my whole brain from scratch — final accuracy ' + (acc * 100).toFixed(1) + '%! Ask me something.', false);
                showChips(['What games are there?', 'Tell me a fact', 'What is 45 times 3', 'How do I add friends?']);
            }, 1400);
        })();
    };

    if (window.__AI_DEPS_READY) boot();
    else window.addEventListener('ai-deps-ready', boot, { once: true });
})();
</script>
