<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {

        background: radial-gradient(1200px 700px at 70% -10%, #1b1440 0%, #0d0b22 55%, #070510 100%);

    header {
        flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 14px 18px;

    .ava {

        background: conic-gradient(from 210deg, #00f3ff, #818cf8, #ff00ff, #00f3ff);
        display: flex; align-items: center; justify-content: center; font-size: 1.35rem;

    @keyframes spin { to { transform: rotate(360deg); } }
    .ava > span { animation: spin 9s linear infinite reverse; }

    header .sub { font-size: .68rem; color: #9aa5b5; letter-spacing: .4px; }
    #ver { position: fixed; left: 10px; bottom: 8px; font-size: .6rem; color: #4b5563; letter-spacing: 1px; z-index: 5; }
    #status { margin-left: auto; font-size: .7rem; color: #34d399; display: flex; align-items: center; gap: 6px; }

    #status.busy { color: #fbbf24; } #status.busy .dot { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }

    #chat { flex: 1; overflow-y: auto; padding: 18px 6%; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 11px 15px; border-radius: 16px; font-size: .93rem; line-height: 1.5;
           animation: pop .22s cubic-bezier(.2,.9,.3,1.2) both; word-wrap: break-word; white-space: pre-wrap; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    .bot  { align-self: flex-start; background: #1a2130; border: 1px solid rgba(255,255,255,.09); border-bottom-left-radius: 5px; }
    .me   { align-self: flex-end; background: linear-gradient(45deg, #0891b2, #2563eb); border-bottom-right-radius: 5px; }
    .msg b { color: #7dd3fc; }
    .msg i { color: #c7d2fe; }
    .msg code { background: rgba(0,243,255,.08); border: 1px solid rgba(0,243,255,.22); padding: 1px 6px; border-radius: 6px; font-family: Consolas, 'Courier New', monospace; font-size: .85em; color: #7dd3fc; }
    .msg pre { background: #0b0f1a; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
    .msg pre code { border: none; background: none; padding: 0; }
    .msg h3, .msg h4 { color: #7dd3fc; margin: 8px 0 3px; font-size: .95rem; letter-spacing: .3px; }
    .msg ul, .msg ol { margin: 6px 0 6px 4px; padding-left: 18px; }
    .msg li { margin: 3px 0; }
    .msg a { color: #7dd3fc; text-decoration: underline; }
    .msg .sp { height: .5em; }
    .typing { align-self: flex-start; display: none; gap: 5px; padding: 13px 16px; background: #1a2130; border-radius: 16px; border-bottom-left-radius: 5px; }
    .typing.show { display: flex; }

    .typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 6% 8px; }
    .chip { padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(0,243,255,.35);
            background: rgba(0,243,255,.07); color: #a5e8ff; font-size: .78rem; cursor: pointer; transition: .15s; }
    .chip:hover { background: rgba(0,243,255,.2); transform: translateY(-1px); }

    footer { flex-shrink: 0; display: flex; gap: 9px; padding: 12px 6% max(14px, env(safe-area-inset-bottom));

    .lfill { height: 100%; width: 0%; border-radius: 8px; background: linear-gradient(90deg, #06b6d4, #818cf8, #ff00ff, #06b6d4); background-size: 200% 100%;

<script>
/* BitBot loader (v6) — REAL progress: every % step is an actual file load. */
(function () {
    var pct = 0, target = 0, el = null, fill = null, step = null;
    function setP(p, label) {
        target = p;
        if (label && step) {
            step.style.opacity = 0;
            setTimeout(function () { step.textContent = label; step.style.opacity = 1; }, 160);
        }
    }
    window.__setLoad = setP;
    window.__loaderDone = function () {
        setP(100, 'ready! 🚀');
        setTimeout(function () {
            var l = document.getElementById('loader');
            if (l) { l.classList.add('hide'); setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 700); }
        }, 400);
    };
    function tick() {
        pct += (target - pct) * 0.14;
        if (Math.abs(target - pct) < 0.4) pct = target;
        if (el) el.textContent = Math.floor(pct) + '%';
        if (fill) fill.style.width = pct + '%';
        requestAnimationFrame(tick);
    }
    document.addEventListener('DOMContentLoaded', function () {
        el = document.getElementById('lpct'); fill = document.getElementById('lfill'); step = document.getElementById('lstep');
        requestAnimationFrame(tick);
        setP(6, 'starting neural core…');
        var files = [
            ['brain.js?v=10',   16, 'loading my brain engine…'],
            ['math.js?v=10',    26, 'loading my math engine — BODMAS, √, ², !, lakh/crore…'],
            ['data.js?v=10',    36, 'loading core knowledge…'],
            ['data2.js?v=10',   48, 'loading the v8 knowledge expansion…'],
            ['data3.js?v=10',   62, 'loading the v9 expansion — 330 topics, SST + ICT + deep maths…'],
            ['weights.js?v=10', 90, 'loading 79-lakh quantized weights — all my memories…']
        ];
        var i = 0;
        function loadCurrent(tries) {
            var f = files[i];
            var s = document.createElement('script');
            s.src = f[0];
            s.onload = function () { setP(f[1], f[2]); i++; setTimeout(loadStep, 140); };
            s.onerror = function () {
                if (tries < 2) setTimeout(function () { loadCurrent(tries + 1); }, 900);
                else if (step) step.textContent = 'could not load ' + f[0] + ' — please refresh the page';
            };
            document.head.appendChild(s);
        }
        function loadStep() {
            if (i < files.length) { loadCurrent(0); return; }
            setP(95, 'building neural net…');
            window.__AI_DEPS_READY = true;
            window.dispatchEvent(new Event('ai-deps-ready'));
        }
        loadStep();
    });
})();
</script>

        try {
            net = BitBrain.Net.load(window.BITBOT_WEIGHTS.net);
            vocabInfo = window.BITBOT_WEIGHTS.vocab;
            vocabInfo.index = {};                                  // rebuild word→idx map
            vocabInfo.words.forEach(function (w, i) { vocabInfo.index[w] = i; });
            document.getElementById('brainspec').textContent =
                vocabInfo.words.length + '→' + net.H + '→' + net.N + ' · ' +
                (net.W1.length + net.b1.length + net.W2.length + net.b2.length).toLocaleString() + ' params';
            PARAMS = net.W1.length + net.b1.length + net.W2.length + net.b2.length;
            statusTxt.textContent = 'neural net ready';

                navigator.serviceWorker.register('./sw.js').catch(function () {});
            }
            if (window.__loaderDone) window.__loaderDone();
        } catch (e) {
            statusTxt.textContent = 'boot error: ' + e.message;
            if (window.__loaderDone) window.__loaderDone();
        }

    function predict(text) {
        var x = BitBrain.bag(text, vocabInfo);
        var p = net.forward(x).p, best = 0, second = -1, third = -1;
        for (var i = 1; i < p.length; i++) {                            // v9: top-3 in one pass
            if (p[i] > p[best]) { third = second; second = best; best = i; }
            else if (second === -1 || p[i] > p[second]) { third = second; second = i; }
            else if (third === -1 || p[i] > p[third]) third = i;
        }
        return {
            tag: vocabInfo.tags[best], prob: p[best],
            tag2: second >= 0 ? vocabInfo.tags[second] : null, prob2: second >= 0 ? p[second] : 0,
            tag3: third >= 0 ? vocabInfo.tags[third] : null, prob3: third >= 0 ? p[third] : 0

    function memActive() { return MEM.lastTag && (Date.now() - MEM.lastTime) < MEM_WINDOW; }

        MEM.lastTag = tag; MEM.lastTime = Date.now();

            MEM.turns.push({ tag: tag, t: Date.now() });
            if (MEM.turns.length > 8) MEM.turns.shift();

        return null;
    }
    function pickFresh(pool, key) {   // anti-repeat: cycle the pool, never same answer twice in a row
        var used = MEM.used[key] || (MEM.used[key] = []);
        var fresh = pool.filter(function (r) { return used.indexOf(r) === -1; });
        if (!fresh.length) { used.length = 0; fresh = pool; }   // pool exhausted → cycle again
        var resp = fresh[Math.floor(Math.random() * fresh.length)];
        used.push(resp);
        cot('💬 choosing response ' + (pool.indexOf(resp) + 1) + ' of ' + pool.length + (fresh.length < pool.length ? ' (anti-repeat active)' : ''));
        return resp;
    }

            " 🕐 (your device time).";

    function quizActive() { return MEM.quiz && (Date.now() - MEM.quizTime) < 3 * 60 * 1000; }
    function doQuiz() {
        var bank = (typeof BitData.QUIZ !== "undefined") ? BitData.QUIZ : [];
        if (!bank.length) return "Quiz bank is empty! 😅";
        var used = MEM.used.__quiz || (MEM.used.__quiz = []);
        var fresh = bank.filter(function (q, i) { return used.indexOf(i) === -1; });
        if (!fresh.length) { used.length = 0; fresh = bank; }        // bank exhausted → cycle
        var q = fresh[Math.floor(Math.random() * fresh.length)];
        used.push(bank.indexOf(q));
        MEM.quiz = { correct: q.correct, options: q.options.slice() };
        MEM.quizTime = Date.now();
        rememberTurn("skill_quizme");
        return "🎯 **Quiz time!** Answer A, B, C or D — or say skip\n\n" + q.q + "\n\n**A)** " +
            q.options[0] + "\n**B)** " + q.options[1] + "\n**C)** " + q.options[2] + "\n**D)** " + q.options[3];
    }
    function quizAnswer(text) {
        if (!quizActive()) return null;
        var t = text.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
        var q = MEM.quiz;
        if (/^(skip|pass|next|chhod do|hatao)$/.test(t)) { MEM.quiz = null; return doQuiz(); }
        var pick = -1;
        var m = t.match(/^(?:option\s*)?([abcd])$/);
        if (m) pick = "abcd".indexOf(m[1]);
        if (pick === -1) for (var i = 0; i < q.options.length; i++)
            if (t === q.options[i].toLowerCase()) { pick = i; break; }
        if (pick === -1) return null;              // not a quiz answer → normal path
        var right = pick === q.correct;
        MEM.quiz = null;
        if (right) return "✅ **CORRECT" + (userName ? ", " + userName : "") + "!** 🎉 You know your stuff! Say **quiz me** for another!";
        return "❌ Not quite — it was **" + String.fromCharCode(65 + q.correct) + ") " + q.options[q.correct] + "**. Say **quiz me** to try again!";

    // ── NAME MEMORY (v5) — survives page reloads via localStorage ─────────
    var userName = null;
    try { userName = localStorage.getItem('bb_name') || null; } catch (e) {}
    var NAME_BLACKLIST = { good:1, fine:1, ok:1, okay:1, sad:1, happy:1, tired:1, bored:1,
        sorry:1, back:1, here:1, ready:1, done:1, hungry:1, angry:1, cool:1, awesome:1,
        great:1, sick:1, busy:1, free:1, later:1, please:1, sure:1, new:1, best:1, lost:1,
        confused:1, curious:1, learning:1, playing:1, asking:1, testing:1, bad:1, mad:1 };
    var RE_NAME_SET  = /(?:my name is|call me|mera naam)\s+([a-zA-Z]+)(?:\s+hai)?\s*[.!?]*$/i;
    var RE_NAME_SET2 = /^(?:i am|i'm|im)\s+([a-zA-Z]+)[.!?]*$/i;
    var RE_NAME_GET  = /what(?:'s| is) my name|do you remember my name|who am i|mera naam kya hai|what do you (call|know) me as|how do you (usually )?(call|refer to) me|by what name do you (call|refer to) me/i;
    var RE_NAME_FORGET = /forget my name|stop calling me|delete my name/i;

    function capName(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }
    function handleName(text) {
        if (RE_NAME_FORGET.test(text)) {
            userName = null; try { localStorage.removeItem('bb_name'); } catch (e) {}
            return "Name forgotten! 🗑️ What should I call you next?";
        }
        if (RE_NAME_GET.test(text))
            return userName
                ? "You are **" + userName + "**! 🧠 My memory works — and it even survives page reloads!"
                : "You haven't told me yet! Say **my name is …** and I'll remember it — even after closing the page.";
        var m = text.match(RE_NAME_SET);
        if (!m && text.split(/\s+/).length <= 4) m = text.match(RE_NAME_SET2);
        if (m) {
            var cand = m[1];
            if (NAME_BLACKLIST[cand.toLowerCase()]) return null;                 // "i am bored" → not a name
            if (!RE_NAME_SET.test(text) && !/^[A-Z]/.test(cand)) return null;    // bare "i am x" needs a capital
            userName = capName(cand);
            try { localStorage.setItem('bb_name', userName); } catch (e) {}
            rememberTurn('user_name');
            return "Nice to meet you, **" + userName + "**! 🤝 I'll remember that — even if you close the page. Try asking **what is my name**!";
        }

    var RE_ACK_BARE = /^(ok+|okay|k|kk|cool|nice|nice one|good one|great|awesome|excellent|perfect|amazing|wow|whoa|oh+|ooh+|haha+|hehe+|lol|lmao|hmm+|good bot|nice bot|best bot|well done|good job|great job|true|right|i see|i understand|understood|love it|love this|love you|yes|yeah|yep)[.!? ]*$/i;
    var RE_DENY = /^(no|nope|nah|no no|no no no|wrong|that is wrong|wrong answer|incorrect|not right|nahi|galat)[!.? ]*$/i;
    function isAck(text) {
        var t = text.toLowerCase().trim();
        if (/good (morning|evening|night|afternoon|day)/.test(t)) return false;   // greetings own these
        if (RE_ACK_BARE.test(t)) return true;
        // "good! you are understanding well!" / "nice, you are learning!"
        if (/^(good|nice|cool|great|awesome|excellent|perfect|amazing|wow|well done|good job)[!,. ]+.{0,60}\byou (are|re)\b.{0,50}$/.test(t)) return true;
        return false;
    }

    // follow-ups are handled BEFORE the neural net — they are pure context
    function handleFollowup(text) {
        var m = text.match(RE_MORE_TOPIC);          // "another joke", "more facts", "one more gk"…
        if (m) {
            var want = m[1].toLowerCase();
            if (want.indexOf("joke") !== -1) { rememberTurn("skill_joke"); return conn() + pickFresh(JOKES, "skill_joke"); }
            if (want.indexOf("gk") !== -1 || want.indexOf("knowledge") !== -1) {
                rememberTurn("gk_more");
                return conn() + pickFresh(intentResponses("gk_more") || FACTS, "gk_more");
            }
            rememberTurn("study_fact"); return conn() + pickFresh(FACTS, "study_fact");
        }
        if (RE_MORE.test(text)) {
            if (!memActive())
                return 'More of what? 🤔 Give me a topic first — try "tell me a fact", "tell me a joke", "explain gravity" or any game!';
            var tag = MEM.lastTag;
            if (tag === "skill_calc")
                return 'More math? Say less! 🧮 Feed me another equation — try "what is 144 divided by 12", "square root of 169" or "2 to the power of 10".';
            if (tag === "skill_convert")
                return 'More conversions? 📐 Try "10 kg to pounds", "100 c to f" or "how many inches is 50 cm"!';
            if (tag === "skill_random")
                return 'Another one? 🎲 Just ask again — "roll a dice", "flip a coin" or "random number between 1 and 50"!';
            if (tag === "skill_quizme")
                return doQuiz();

    function respond(text) {

            }

        if (r.prob < THRESHOLD || (coverage < 0.35 && r.prob < 0.75)) {
            // low confidence → HONEST fallback, never a confident guess (+ memory hint)
            cot('🚦 below ' + Math.round(THRESHOLD * 100) + '% confidence → admitting I do not know');
            setTimeout(function () { showChips(["Tell me a fact", "Tell me a joke", "What games are there?", "How do I add friends?"]); }, 300);
            var fb = fallbackMsg();
            var pm = text.match(/who (?:is|was|are)\s+([a-z][a-z .]{1,25})/i);
            if (pm) fb = "I don't know **" + pm[1].trim() + "** — a friend of yours? 😄 I know Arcade Hub, school subjects (science, math, history, GK) and general knowledge!";
            if (memActive()) fb += "\n\nPS: we were just talking about " + topicLabel(MEM.lastTag) + ' — say "more" if you want more of that!';
            return fb;
        }
        // v7 HONESTY GUARD: salient unknown words + not-high confidence → admit ignorance
        var salientUnknown = [];
        toks.forEach(function (w) { if (w.length >= 4 && vocabInfo.index[w] === undefined && !/^\d+$/.test(w)) salientUnknown.push(w); });
        if (salientUnknown.length && r.prob < 0.75) {
            cot('🚨 unknown word' + (salientUnknown.length > 1 ? 's' : '') + ': ' + salientUnknown.join(', ') + ' — only ' + (r.prob * 100).toFixed(0) + '% sure → admitting ignorance');
            setTimeout(function () { showChips(["Tell me a fact", "Tell me a joke", "What games are there?", "How do I add friends?"]); }, 300);
            var fb2 = fallbackMsg();
            var pm2 = text.match(/who (?:is|was|are)\s+([a-z][a-z .]{1,25})/i);
            if (pm2) fb2 = "I don't know **" + pm2[1].trim() + "** — a friend of yours? 😄 I know Arcade Hub, school subjects (science, math, history, GK) and general knowledge!";
            else fb2 = "I don't fully understand that — some words are new to me! 🤷 Try simpler wording, or ask about games, math, science, GK, history or the site.";
            if (memActive()) fb2 += "\n\nPS: we were just talking about " + topicLabel(MEM.lastTag) + ' — say "more" if you want more of that!';
            return fb2;
        }
        var hedge = r.prob < 0.68 ? "🤔 Not fully sure, but here's my best answer:\n\n" : "";
        if (hedge) cot('⚖ only ' + (r.prob * 100).toFixed(0) + '% sure → answering with an honest hedge');
        return hedge + answerFor(text, r, game || (pronounRef ? lastGame : null));
    }

    // given a confident classification, produce the answer (shared with multi-question mode)
    function answerFor(text, r, game) {
        // ── SKILLS: computed live, not memorized ─────────────────────
        if (r.tag === "bot_speed") {
            rememberTurn("bot_speed");
            var t0 = performance.now(), N = 1000;
            for (var si = 0; si < N; si++) predict("how do i enable notifications on my phone");
            var ms = performance.now() - t0;
            cot('⚡ live benchmark: ' + N + ' classifications in ' + ms.toFixed(1) + ' ms');
            return "⚡ **Speed test — live result:**\nI just classified **" + N + " messages in " + ms.toFixed(1) + " ms** — that is **" + (ms / N * 1000).toFixed(0) + " microseconds per answer**!\n\nPure math, zero lag. Try to out-ask me! 😄";
        }
        if (r.tag === "skill_quizme") { cot('🎯 quiz skill → picking an unseen question'); rememberTurn("skill_quizme"); return doQuiz(); }
        if (r.tag === "skill_convert") {
            var cv = doConvert(text);
            if (cv) { rememberTurn("skill_convert"); return cv; }
            if (!/\d/.test(text)) return fallbackMsg();     // no numbers → was a misclassification
            return 'Give me units to convert! 📐 Try "5 km to miles", "10 kg in pounds" or "100 c to f".';
        }
        if (r.tag === "skill_random") { cot('🎲 dice/coin/random skill'); rememberTurn("skill_random"); return doRandom(text); }
        if (r.tag === "skill_calc") {
            var cv2 = doConvert(text);
            if (cv2) { rememberTurn("skill_convert"); return cv2; }
            cot('🧮 full-math solver engaged');
            rememberTurn("skill_calc"); return doMath(text);
        }
        if (r.tag === "skill_time") { cot('🕐 live clock skill'); rememberTurn("skill_time"); return timeAnswer(); }
        if (r.tag === "skill_joke") { rememberTurn("skill_joke"); return pickFresh(JOKES, "skill_joke"); }
        if (r.tag === "study_fact") { rememberTurn("study_fact"); return pickFresh(FACTS, "study_fact"); }
        // entity-driven intents
        if (r.tag === "game_info" || r.tag === "how_to_play") {
            var g2 = game || lastGame;
            if (g2) {
                rememberTurn(r.tag);
                var g = BitData.GAMES[g2];
                return r.tag === "game_info" ? g.info : g.play;
            }
            return "Which game? 🎮 Try: car, snake, flappy, dino, pacman, tic tac toe, arcadecraft or the quiz!";
        }
        // find the intent's responses (anti-repeat cycling)
        var rs = intentResponses(r.tag);
        if (rs && rs.length) { rememberTurn(r.tag); return pickFresh(rs, r.tag); }
        return fallbackMsg();
    }

    // v7: multi-question v2 — answer every understood part, ADMIT the rest
    function multiAnswer(text) {
        var parts = text.split(/[?!.]\s+/).map(function (s) { return s.trim(); })
                        .filter(function (s) { return s.length > 2; });
        if (parts.length < 2) return null;
        var answers = [], unknown = 0, seenTags = {};
        for (var i = 0; i < parts.length && i < 3; i++) {
            var seg = parts[i];
            var toks = BitBrain.tokenize(seg).map(BitBrain.stem);
            var known = 0;
            toks.forEach(function (w) { if (vocabInfo.index[w] !== undefined) known++; });
            var coverage = toks.length ? known / toks.length : 0;
            var pr = predict(seg);
            if (coverage < 0.35 || pr.prob < 0.45) { unknown++; continue; }
            if (seenTags[pr.tag]) continue;
            seenTags[pr.tag] = 1;
            var gm = findGame(seg);
            if (gm) { lastGame = gm; MEM.gameTime = Date.now(); }
            answers.push({ tag: pr.tag, ans: answerFor(seg, pr, gm || lastGame) });
        }
        if (!answers.length) return null;             // nothing understood → normal path / honest fallback
        cot('✂ detected ' + parts.length + ' questions → understood ' + answers.length + (unknown ? ', admitted ' + unknown + ' unknown' : ''));
        if (answers.length === 1) {
            rememberTurn(answers[0].tag);
            return (unknown ? "I caught **one** of those questions 😄 — here goes:\n\n" : "") +
                answers[0].ans +
                (unknown ? "\n\n*(the other part went over my head — try asking it alone? 🤔)*" : "");
        }
        var out = "You asked **" + answers.length + " things**! 😄\n\n";
        answers.forEach(function (a, idx) {
            out += "**" + (idx + 1) + ")** " + a.ans + "\n\n";
        });
        rememberTurn(answers[answers.length - 1].tag);
        return out + "Ask one at a time for the full markdown answer! 📝";
    }

    // ── MARKDOWN RENDERER (v5) ─────────────────────────────────────────────
    // BitBot answers in markdown (like real AIs); this renders it in the
    // chat: **bold**, *italic*, code, code blocks, # headings, lists, links.
    function mdInline(t) {
        return t
            .replace(/\u0060([^\u0060]+)\u0060/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
            .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<i>$2</i>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    function mdRender(src) {
        var esc = String(src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var lines = esc.split('\n');
        var out = [], inUl = false, inOl = false, inCode = false, buf = [];
        function closeList() { if (inUl) { out.push('</ul>'); inUl = false; } if (inOl) { out.push('</ol>'); inOl = false; } }
        for (var i = 0; i < lines.length; i++) {
            var ln = lines[i];
            if (/^[\u0060]{3}/.test(ln)) {
                if (inCode) { out.push('<pre><code>' + buf.join('\n') + '</code></pre>'); buf = []; inCode = false; }
                else { closeList(); inCode = true; }
                continue;
            }
            if (inCode) { buf.push(ln); continue; }
            var h = ln.match(/^(#{1,3})\s+(.*)$/);
            if (h) { closeList(); out.push('<h' + (h[1].length + 2) + '>' + mdInline(h[2]) + '</h' + (h[1].length + 2) + '>'); continue; }
            var ul = ln.match(/^[-•]\s+(.*)$/);
            var ol = ln.match(/^\d+[.)]\s+(.*)$/);
            if (ul || ol) {
                if (ul && inOl) { out.push('</ol>'); inOl = false; }
                if (ol && inUl) { out.push('</ul>'); inUl = false; }
                if (ul && !inUl) { out.push('<ul>'); inUl = true; }
                if (ol && !inOl) { out.push('<ol>'); inOl = true; }
                out.push('<li>' + mdInline(ul ? ul[1] : ol[1]) + '</li>');
                continue;
            }
            closeList();
            if (ln.trim() === '') out.push('<div class="sp"></div>');
            else out.push('<div>' + mdInline(ln) + '</div>');
        }
        closeList();
        if (inCode) out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
        return out.join('');
    }

    // ── CHAIN OF THOUGHT (v7) — real reasoning steps, shown before each answer ──
    var COT = [];
    function cot(line) { COT.push(line); }
    function showThinking(trace, done) {
        if (!trace || !trace.length) { done(); return; }
        var d = document.createElement('div');
        d.className = 'cot open';
        var head = document.createElement('div');
        head.className = 'thead';
        head.textContent = '🧠 thinking…';
        var body = document.createElement('div');
        body.className = 'tbody';
        d.appendChild(head); d.appendChild(body);
        chat.appendChild(d); scroll();
        var i = 0;
        (function next() {
            if (i < trace.length) {
                var ln = document.createElement('div');
                ln.className = 'tstep';
                ln.textContent = trace[i++];
                body.appendChild(ln); scroll();
                head.textContent = '🧠 thinking (' + i + '/' + trace.length + ')…';
                setTimeout(next, 240);
            } else {
                d.classList.remove('open');
                head.textContent = '🧠 ' + trace.length + ' steps ▾';
                head.onclick = function () { d.classList.toggle('open'); scroll(); };
                setTimeout(done, 200);
            }
        })();
    }

    // ── UI ─────────────────────────────────────────────────────────────────
    function addMsg(cls, text, instant) {
        var d = document.createElement('div');
        d.className = 'msg ' + cls;
        var c = document.createElement('div');
        c.className = 'mbody';
        d.appendChild(c);
        var ts = document.createElement('span');                       // v6: timestamp
        ts.className = 'time';
        ts.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        d.appendChild(ts);
        chat.appendChild(d);
        if (instant || cls === 'me') { c.textContent = text; scroll(); return; }
        // stream the bot's answer character by character, then render markdown
        var i = 0;
        (function step() {
            i += 2;
            c.textContent = text.slice(0, i);
            scroll();
            if (i < text.length) setTimeout(step, 14);
            else { try { c.innerHTML = mdRender(text); } catch (e) { c.textContent = text; } scroll(); }
        })();
    }
    function scroll() { chat.scrollTop = chat.scrollHeight; }
    function showChips(list) {
        chipsEl.innerHTML = '';
        list.forEach(function (q) {
            var c = document.createElement('div');
            c.className = 'chip'; c.textContent = q;
            c.onclick = function () { chipsEl.innerHTML = ''; send(q); };
            chipsEl.appendChild(c);
        });
    }
    function greet() {
        var h = new Date().getHours();
        var tod = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Up late";
        addMsg("bot", userName
            ? "**" + tod + ", " + userName + "!** 👋 Welcome back — I remembered you! I'm BitBot v9 with a **79-lakh-parameter brain** and **visible chain-of-thought**: watch the 🧠 steps before every answer!"
            : "**" + tod + "!** 👋 I'm **BitBot v9** 🤖 — now with a **79-lakh-parameter neural brain**, **330 topics** (science → SST → ICT → esports!), **typo-tolerant understanding**, a **full BODMAS math engine with step-by-step working**, **visible chain-of-thought**, **quiz mode** and a **speed test**. Tell me your name — I'll remember it!", false);
        showChips(["Quiz me", "How fast are you?", "Tell me a fact", "Table of 7"]);
    }
    function send(text) {
        text = (text || '').trim();
        if (!text || !net) return;
        addMsg('me', text);
        inp.value = '';
        typingEl.classList.add('show'); scroll();
        setTimeout(function () {
            typingEl.classList.remove('show');
            var ans;
            try { ans = respond(text); }                                        // v6: never crash on a bug
            catch (e) { ans = "Oops — my neurons hiccuped! 🤯 Ask me again, maybe in simpler words?"; }
            showThinking(COT.slice(), function () { addMsg('bot', ans, false); });   // v7: chain of thought first
        }, 420 + Math.random() * 500);
    }

    document.getElementById('clearBtn').onclick = function () {           // v6: fresh chat, instantly
        chat.innerHTML = ''; chipsEl.innerHTML = '';
        MEM.turns = []; MEM.lastTag = null; MEM.lastTime = 0; MEM.used = {}; MEM.quiz = null;
        greet();
    };
    document.getElementById('send').onclick = function () { send(inp.value); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(inp.value); });

    // ── LIVE TRAINING ("watch it learn") — chunked, non-blocking ──────────
    document.getElementById('trainBtn').onclick = function () {
        var ov = document.getElementById('trainOv'),
            fill = document.getElementById('trainFill'),
            stats = document.getElementById('trainStats');
        ov.classList.add('show');
        statusEl.classList.add('busy'); statusTxt.textContent = 'training…';
        window.__PATTERN_COUNT = BitData.INTENTS.reduce(function (s, i) { return s + i.patterns.length; }, 0);
        var t = BitBrain.makeTrainer(BitData.INTENTS, { seed: 1337, hidden: 256 });
        var EPOCHS = 12, e = 0, r = BitBrain.rng(4242);
        (function chunk() {
            var t0 = performance.now();
            while (e < EPOCHS && performance.now() - t0 < 28) {   // ≤28ms slices → 60fps
                var loss = t.epoch(r, e < 6 ? 0.12 : 0.05);
                fill.style.width = ((e + 1) / EPOCHS * 100).toFixed(0) + '%';
                if (e % 4 === 0 || e === EPOCHS - 1) {
                    stats.innerHTML = 'epoch ' + (e + 1) + '/' + EPOCHS + ' · loss ' + loss.toFixed(4) +
                        '<br>training accuracy: <b style="color:#34d399">' + (t.accuracy() * 100).toFixed(1) + '%</b>';
                } else {
                    stats.innerHTML = 'epoch ' + (e + 1) + '/' + EPOCHS + ' · loss ' + loss.toFixed(4) +
                        '<br>SGD + backprop on ' + window.__PATTERN_COUNT + ' patterns…';
                }
                e++;
            }
            if (e < EPOCHS) { setTimeout(chunk, 0); return; }
            fill.style.width = '100%';
            var acc = t.accuracy();
            stats.innerHTML = '✅ Training complete!<br>final training accuracy: <b style="color:#34d399">' + (acc * 100).toFixed(1) + '%</b>' +
                '<br>weights swapped into the live net.';
            net = t.net;                                            // hot-swap the brain
            vocabInfo = t.vocab; vocabInfo.tags = t.tags;             // vocab + tag list!
            setTimeout(function () {
                ov.classList.remove('show');
                statusEl.classList.remove('busy'); statusTxt.textContent = 'self-trained ✓';
                addMsg('bot', '🧠 I just grew a FRESH brain from scratch right in your browser — 12-epoch quick-train, final accuracy ' + (acc * 100).toFixed(1) + '%! (My shipped brain is the bigger 120-epoch, 79-lakh-parameter one — reload the page to bring it back.) Ask me something!', false);
                showChips(['What games are there?', 'Tell me a fact', 'What is 45 times 3', 'How do I add friends?']);
            }, 1400);
        })();
    };

    if (window.__AI_DEPS_READY) boot();
    else window.addEventListener('ai-deps-ready', boot, { once: true });
})();
</script>
